<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Handling — Beta</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }
    .header { background: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; }
    .header img { height: 28px; }
    .header span { font-size: 14px; font-weight: 700; color: #7A4610; }
    .back { margin-left: auto; font-size: 12px; color: #aaa; text-decoration: none; border: 1px solid #ddd; border-radius: 20px; padding: 4px 14px; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .state { text-align: center; color: #aaa; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>

<div class="header">
  <img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <span>Orders Handling <sup style="font-size:9px;color:#aaa;">BETA</sup></span>
  <a href="index.html" class="back">← Back</a>
</div>

<div class="container">
  <div class="state" id="state">Loading orders…</div>
</div>

<script>
  const WC_BASE = "https://timberedgroup.com/wp-json/wc/v3/orders?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de&orderby=date&order=desc&per_page=100";

  async function fetchAllOrders() {
      let all = [], page = 1;
      while (true) {
          const res  = await fetch(WC_BASE + '&page=' + page);
          const rows = await res.json();
          if (!rows.length) break;
          all = all.concat(rows);
          if (rows.length < 100) break;
          page++;
      }
      return all;
  }

  fetchAllOrders().then(orders => {
      document.getElementById('state').textContent = orders.length + ' orders loaded — ready to build.';
  }).catch(e => {
      document.getElementById('state').textContent = 'Error loading orders: ' + e.message;
  });
</script>

</body>
</html>
