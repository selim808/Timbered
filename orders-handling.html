<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Handling — Timbered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    /* HEADER */
    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 100; }
    .site-header img { height: 26px; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .site-header .back { margin-left: auto; font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }
    .site-header .badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }

    /* STATE */
    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    /* BOARD */
    .board-wrap { overflow-x: auto; padding: 16px; }
    .board { display: flex; gap: 12px; align-items: flex-start; min-width: max-content; }

    /* COLUMN */
    .col { width: 200px; flex-shrink: 0; background: #fff; border-radius: 12px; border: 1px solid #e8ddd4; display: flex; flex-direction: column; }
    .col-header { padding: 10px 12px; border-bottom: 1px solid #f0e8e0; }
    .col-title { font-size: 11px; font-weight: 700; color: #7A4610; text-transform: uppercase; letter-spacing: 0.4px; }
    .col-count { font-size: 10px; color: #aaa; margin-top: 2px; }
    .col-body { padding: 8px; min-height: 80px; display: flex; flex-direction: column; gap: 6px; }
    .col-body.drag-over { background: #fef3e2; border-radius: 0 0 12px 12px; }

    /* CARD */
    .card { background: #fafafa; border: 1px solid #e8ddd4; border-radius: 8px; padding: 8px 10px; cursor: grab; user-select: none; transition: box-shadow 0.15s; }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.4; }
    .card-days { font-size: 10px; font-weight: 700; color: #fff; background: #7A4610; border-radius: 4px; display: inline-block; padding: 1px 6px; margin-bottom: 5px; }
    .card-days.urgent { background: #e74c3c; }
    .card-days.warn   { background: #e67e22; }
    .card-id   { font-size: 10px; color: #aaa; margin-bottom: 2px; }
    .card-name { font-size: 12px; font-weight: 600; color: #333; line-height: 1.3; }
    .card-qty  { font-size: 11px; color: #888; margin-top: 4px; }
    .card-saving { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>

<div class="site-header">
  <img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <span class="title">Orders Handling</span>
  <span class="badge" id="orderCount">Loading…</span>
  <a href="index.html" class="back">← Back</a>
</div>

<div id="state">Fetching processing orders…</div>
<div class="board-wrap" id="boardWrap" style="display:none;">
  <div class="board" id="board"></div>
</div>

<script>
  const WC_BASE = "https://timberedgroup.com/wp-json/wc/v3/orders"
               + "?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
               + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de"
               + "&status=processing&orderby=date&order=desc&per_page=100";

  const WC_PUT = id => "https://timberedgroup.com/wp-json/wc/v3/orders/" + id
               + "?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
               + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de";

  const PHASES = [
    "Chk Inventory","Refurbish","Model & DWG","Job order preparation","Procurement",
    "Cutting","CNC","Shaping & Joint prep.","Sand-fillet","Assemble & label",
    "Paint & inspec.","Rdy for ship","Sent to WH","Not Received in WH","Already in WH",
    "Not available in WH","Sent to Workshop","WH-Defected","WH-No_Response",
    "WH-Postponed","WH-Returned","WH-Ready","DLV-Bareed-Cairo","DLV-Bareed-Tanta",
    "DLV-Bosta","DLV-Private","Partial - Delivered"
  ];

  // ── Fetch all processing orders ──────────────────────────────────
  async function fetchAllOrders() {
    let all = [], page = 1;
    while (true) {
      const res  = await fetch(WC_BASE + '&page=' + page);
      const rows = await res.json();
      if (!rows.length) break;
      all = all.concat(rows);
      if (rows.length < 100) break;
      page++;
    }
    return all;
  }

  // ── Save kanban_phases meta back to WooCommerce ──────────────────
  async function savePhases(orderId, phasesObj) {
    await fetch(WC_PUT(orderId), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        meta_data: [{ key: 'kanban_phases', value: JSON.stringify(phasesObj) }]
      })
    });
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function daysSince(dateStr) {
    if (!dateStr) return 0;
    const created = new Date(dateStr);
    const now     = new Date();
    return Math.floor((now - created) / 86400000);
  }

  function daysClass(d) {
    if (d >= 14) return 'urgent';
    if (d >= 7)  return 'warn';
    return '';
  }

  // ── Build board ──────────────────────────────────────────────────
  function buildBoard(orders) {
    const board = document.getElementById('board');
    board.innerHTML = '';

    // colMap: phase → { el: colBody, cards: [] }
    const colMap = {};
    PHASES.forEach(phase => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<div class="col-header"><div class="col-title">${phase}</div><div class="col-count" id="cnt-${encodePhase(phase)}">0 items</div></div><div class="col-body" data-phase="${phase}"></div>`;
      board.appendChild(col);
      const body = col.querySelector('.col-body');
      colMap[phase] = body;
      setupDropZone(body);
    });

    // Expand orders → line item cards
    let totalItems = 0;
    orders.forEach(order => {
      // Read saved phases from meta
      const meta       = order.meta_data || [];
      const phaseMeta  = meta.find(m => m.key === 'kanban_phases');
      const savedPhases = phaseMeta ? JSON.parse(phaseMeta.value) : {};

      const itemCount = order.line_items.length;
      const days      = daysSince(order.date_created);

      order.line_items.forEach((item, idx) => {
        const phase = savedPhases[item.id] || 'Chk Inventory';
        const card  = createCard(order, item, idx + 1, itemCount, days, phase, savedPhases);
        const col   = colMap[phase];
        if (col) col.appendChild(card);
        totalItems++;
      });
    });

    // Update counts
    PHASES.forEach(phase => {
      const body = colMap[phase];
      const cnt  = document.getElementById('cnt-' + encodePhase(phase));
      if (cnt) cnt.textContent = body.children.length + ' item' + (body.children.length !== 1 ? 's' : '');
    });

    document.getElementById('orderCount').textContent = orders.length + ' orders · ' + totalItems + ' items';
  }

  function encodePhase(p) { return p.replace(/[^a-zA-Z0-9]/g, '_'); }

  function createCard(order, item, itemNo, itemCount, days, phase, savedPhases) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.orderId  = order.id;
    card.dataset.itemId   = item.id;
    card.dataset.phase    = phase;

    const dc = daysClass(days);
    card.innerHTML = `
      <div class="card-days ${dc}">${days}d</div>
      <div class="card-id">#${order.id} · ${itemNo}/${itemCount}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-qty">Qty: ${item.quantity}</div>`;

    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({
        orderId: order.id,
        itemId:  item.id
      }));
      card.classList.add('dragging');
      // store the full savedPhases on the card so we can update it on drop
      card._savedPhases = savedPhases;
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    return card;
  }

  function setupDropZone(colBody) {
    colBody.addEventListener('dragover', e => {
      e.preventDefault();
      colBody.classList.add('drag-over');
    });
    colBody.addEventListener('dragleave', () => colBody.classList.remove('drag-over'));
    colBody.addEventListener('drop', async e => {
      e.preventDefault();
      colBody.classList.remove('drag-over');

      const { orderId, itemId } = JSON.parse(e.dataTransfer.getData('text/plain'));
      const newPhase = colBody.dataset.phase;

      // Find the dragged card
      const card = document.querySelector(`.card[data-order-id="${orderId}"][data-item-id="${itemId}"]`);
      if (!card) return;

      const oldPhase = card.dataset.phase;
      if (oldPhase === newPhase) return;

      // Move card visually
      colBody.appendChild(card);
      card.dataset.phase = newPhase;
      card.classList.add('card-saving');

      // Update phase in savedPhases and save
      const savedPhases = card._savedPhases || {};
      savedPhases[itemId] = newPhase;
      card._savedPhases = savedPhases;

      await savePhases(orderId, savedPhases);
      card.classList.remove('card-saving');

      // Update column counts
      updateCount(oldPhase);
      updateCount(newPhase);
    });
  }

  function updateCount(phase) {
    const body = document.querySelector(`.col-body[data-phase="${phase}"]`);
    const cnt  = document.getElementById('cnt-' + encodePhase(phase));
    if (body && cnt) cnt.textContent = body.children.length + ' item' + (body.children.length !== 1 ? 's' : '');
  }

  // ── Init ─────────────────────────────────────────────────────────
  fetchAllOrders().then(orders => {
    document.getElementById('state').style.display = 'none';
    document.getElementById('boardWrap').style.display = 'block';
    buildBoard(orders);
  }).catch(e => {
    document.getElementById('state').textContent = 'Error: ' + e.message;
  });
</script>
</body>
</html>
