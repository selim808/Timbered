<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Map — Timbered</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; display: flex; flex-direction: column; height: 100dvh; }

    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; flex-shrink: 0; }
    .site-header img { height: 26px; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .site-header .badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
    .site-header .back { margin-left: auto; font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }

    #state { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    #progress { font-size: 11px; color: #aaa; text-align: center; padding: 4px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #f0e8e0; }
    #map { flex: 1; }

    /* Popup styling */
    .leaflet-popup-content { margin: 8px 12px; }
    .pop-id   { font-size: 10px; color: #aaa; }
    .pop-name { font-size: 13px; font-weight: 700; color: #222; margin: 2px 0; }
    .pop-total { font-size: 13px; font-weight: 700; color: #7A4610; }
    .pop-phone { font-size: 11px; color: #666; margin-top: 3px; }
    .pop-addr  { font-size: 11px; color: #999; margin-top: 2px; }
    .pop-days  { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:#7A4610; border-radius:4px; padding:1px 5px; margin-top:4px; }
    .pop-days.warn { background:#e67e22; }
    .pop-days.urgent { background:#e74c3c; }
  </style>
</head>
<body>

<div class="site-header">
  <img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <span class="title">Orders Map</span>
  <span class="badge" id="pinCount">Loading…</span>
  <a href="orders.html" class="back">← Back</a>
</div>

<div id="progress"></div>
<div id="state">Fetching orders…</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const WC_BASE = "https://timberedgroup.com/wp-json/wc/v3/orders"
               + "?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
               + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de"
               + "&status=processing&orderby=date&order=desc&per_page=100";

  const EG_STATES = {
    "0":"Alexandria","1":"Assuit","2":"Aswan","3":"Bani Suif","4":"Behira",
    "5":"Cairo","6":"Dakahlia","7":"Damietta","8":"El Kalioubia","9":"Fayoum",
    "10":"Gharbia","11":"Giza","12":"Ismailia","13":"Kafr Alsheikh","14":"Luxor",
    "15":"Matrouh","16":"Menya","17":"Monufia","18":"New Valley","19":"North Coast",
    "21":"Port Said","22":"Qena","23":"Red Sea","24":"Sharqia","25":"Sohag",
    "26":"South Sinai","27":"Suez"
  };

  async function fetchAllOrders() {
    let all = [], page = 1;
    while (true) {
      const res  = await fetch(WC_BASE + '&page=' + page);
      const rows = await res.json();
      if (!rows.length) break;
      all = all.concat(rows);
      if (rows.length < 100) break;
      page++;
    }
    return all;
  }

  function daysSince(dateStr) {
    return Math.floor((new Date() - new Date(dateStr)) / 86400000);
  }

  // Geocode using Nominatim — rate limited to 1 req/sec
  async function geocode(address) {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
              + encodeURIComponent(address + ', Egypt');
    const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
    return null;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function markerColor(days) {
    if (days >= 14) return '#e74c3c';
    if (days >= 7)  return '#e67e22';
    return '#7A4610';
  }

  function makeIcon(days) {
    const color = markerColor(days);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 9.625 14 22 14 22S28 23.625 28 14C28 6.27 21.73 0 14 0z" fill="${color}"/>
      <circle cx="14" cy="14" r="6" fill="#fff"/>
    </svg>`;
    return L.divIcon({
      html: svg,
      className: '',
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -36]
    });
  }

  (async () => {
    const orders = await fetchAllOrders();
    document.getElementById('state').style.display = 'none';

    // Init map centered on Egypt
    const map = L.map('map').setView([26.8, 30.8], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const prog    = document.getElementById('progress');
    const bounds  = [];
    let pinned    = 0;

    for (let i = 0; i < orders.length; i++) {
      const o    = orders[i];
      const b    = o.billing;
      const state = EG_STATES[b.state] || b.state || '';
      const addrStr = [b.address_1, b.address_2, state].filter(Boolean).join(', ');

      prog.textContent = `Geocoding ${i + 1} / ${orders.length}…`;

      const coords = await geocode(addrStr);
      await sleep(1100); // respect Nominatim 1 req/sec limit

      if (!coords) continue;

      const days   = daysSince(o.date_created);
      const dc     = days >= 14 ? 'urgent' : days >= 7 ? 'warn' : '';
      const name   = [b.first_name, b.last_name].filter(Boolean).join(' ');

      const marker = L.marker([coords.lat, coords.lng], { icon: makeIcon(days) }).addTo(map);
      marker.bindPopup(`
        <div class="pop-id">#${o.id}</div>
        <div class="pop-name">${name}</div>
        <div class="pop-total">${parseInt(o.total).toLocaleString()} EGP</div>
        <div class="pop-phone">${b.phone || '—'}</div>
        <div class="pop-addr">${addrStr}</div>
        <div class="pop-days ${dc}">${days}d</div>
      `);

      bounds.push([coords.lat, coords.lng]);
      pinned++;
      document.getElementById('pinCount').textContent = pinned + ' pinned';
    }

    prog.textContent = '';
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
  })();
</script>
</body>
</html>
