<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Databases — Timbered</title>
  <link rel="shortcut icon" type="image/png" href="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      background: #7A4610; color: #fff;
      height: 52px; padding: 0 20px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo { font-size: 16px; font-weight: 700; }
    .topbar-sub { font-size: 12px; opacity: .55; margin-right: auto; }
    .topbar-btn {
      background: rgba(255,255,255,.15); color: #fff;
      border: 1px solid rgba(255,255,255,.3); border-radius: 7px;
      padding: 5px 13px; font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    .topbar-btn:hover { background: rgba(255,255,255,.25); }

    /* ── Tab bar ── */
    .tab-bar {
      background: #fff; border-bottom: 1px solid #e8ddd4;
      padding: 0 20px; display: flex; gap: 0;
      position: sticky; top: 52px; z-index: 90;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 13px 18px; font-size: 13px; font-weight: 600; color: #888;
      border: none; border-bottom: 3px solid transparent; background: none;
      cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 7px;
      transition: color .15s;
    }
    .tab-btn:hover { color: #7A4610; }
    .tab-btn.active { color: #7A4610; border-bottom-color: #7A4610; }
    .tab-count {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
      background: #f5f0eb; color: #7A4610;
    }
    .tab-btn.active .tab-count { background: #7A4610; color: #fff; }

    /* ── Page body ── */
    .page-body { padding: 20px; max-width: 1200px; margin: 0 auto; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Toolbar ── */
    .toolbar {
      background: #fff; border: 1px solid #e8ddd4; border-radius: 10px;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .search-wrap { position: relative; flex: 1; max-width: 360px; }
    .search-wrap input {
      width: 100%; font-size: 13px; padding: 7px 10px 7px 32px;
      border: 1px solid #e8ddd4; border-radius: 8px; background: #f5f0eb;
      outline: none; color: #333;
    }
    .search-wrap input:focus { border-color: #7A4610; background: #fff; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #aaa; pointer-events: none; }
    .count-label { font-size: 12px; color: #aaa; margin-left: auto; }

    /* ── Table ── */
    .tbl-wrap { background: #fff; border: 1px solid #e8ddd4; border-radius: 10px; overflow: hidden; }
    .data-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-tbl th {
      text-align: left; padding: 9px 12px;
      background: #faf7f4; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; color: #888;
      border-bottom: 1px solid #e8ddd4; white-space: nowrap;
    }
    .data-tbl td { padding: 9px 12px; border-bottom: 1px solid #f0ebe4; vertical-align: top; }
    .data-tbl tr:last-child td { border-bottom: none; }
    .data-tbl tbody tr:hover td { background: #fdf9f6; }

    .loading-row td, .empty-row td {
      text-align: center; padding: 40px; color: #aaa; font-size: 13px;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 10px;
    }
    .badge-phase  { background: #e0f0ff; color: #1d4ed8; }
    .badge-status { background: #f0fdf4; color: #15803d; }
    .badge-status.cancelled { background: #fff0f0; color: #dc2626; }
    .badge-status.completed { background: #f0fdf4; color: #15803d; }
    .badge-status.processing { background: #eff6ff; color: #1d4ed8; }
    .badge-status.on-hold { background: #fefce8; color: #a16207; }
    .badge-mat { background: #fef3e2; color: #7A4610; }
    .badge-count { background: #f5f0eb; color: #666; }

    /* ── History / Parts expand ── */
    .expand-btn {
      background: none; border: 1px solid #e0d8d0; border-radius: 5px;
      padding: 2px 8px; font-size: 11px; color: #7A4610; cursor: pointer;
      font-weight: 600;
    }
    .expand-btn:hover { background: #f5f0eb; }
    .sub-row { display: none; }
    .sub-row.open { display: table-row; }
    .sub-cell {
      background: #faf7f4; padding: 10px 14px 14px 40px !important;
      border-bottom: 1px solid #e8ddd4 !important;
    }
    .sub-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sub-table th { color: #aaa; font-weight: 700; text-align: left; padding: 4px 8px 4px 0; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid #ede5dc; }
    .sub-table td { padding: 5px 8px 5px 0; border-bottom: 1px solid #f5f0eb; color: #555; }
    .sub-table tr:last-child td { border-bottom: none; }

    .no-history { font-size: 12px; color: #bbb; font-style: italic; }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 8px; padding: 12px 0; justify-content: center; }
    .page-btn {
      background: #fff; border: 1px solid #e0d8d0; border-radius: 6px;
      padding: 5px 12px; font-size: 12px; color: #7A4610; cursor: pointer; font-weight: 600;
    }
    .page-btn:hover { background: #f5f0eb; }
    .page-btn:disabled { color: #ccc; cursor: not-allowed; background: #fff; }
    .page-info { font-size: 12px; color: #aaa; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      transition: opacity .3s; z-index: 200; pointer-events: none;
    }
    .toast.hidden { opacity: 0; }
    .toast.saving { background: #fef3c7; color: #92400e; opacity: 1; }
    .toast.ok     { background: #d1fae5; color: #065f46; opacity: 1; }
    .toast.err    { background: #fee2e2; color: #991b1b; opacity: 1; }

    /* ── Products v2 parts cell ── */
    .parts-preview { font-size: 11px; color: #888; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Firebase Databases</div>
  <div class="topbar-sub">Timbered · live read-only view</div>
  <a href="index.html" style="color:#fff;font-size:12px;opacity:.7;text-decoration:none;">← Dashboard</a>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('phases')" id="tab-phases">
    Order Phases <span class="tab-count" id="cnt-phases">–</span>
  </button>
  <button class="tab-btn" onclick="switchTab('products')" id="tab-products">
    Products <span class="tab-count" id="cnt-products">–</span>
  </button>
  <button class="tab-btn" onclick="switchTab('products_v2')" id="tab-products_v2">
    Products v2 <span class="tab-count" id="cnt-products_v2">–</span>
  </button>
</div>

<div class="toast hidden" id="toast"></div>

<div class="page-body">

  <!-- ══════════════════════════════
       TAB: ORDER PHASES
  ══════════════════════════════ -->
  <div class="tab-panel active" id="panel-phases">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-phases" placeholder="Search order ID, line item, phase…" oninput="filterPhases()">
      </div>
      <select id="filter-phase-status" onchange="filterPhases()" style="font-size:12px;padding:6px 10px;border:1px solid #e8ddd4;border-radius:8px;background:#f5f0eb;color:#555;outline:none;">
        <option value="">All WC Statuses</option>
      </select>
      <span class="count-label" id="phases-count-label"></span>
      <button class="topbar-btn" onclick="loadPhases()">↺ Refresh</button>
    </div>
    <div class="tbl-wrap">
      <table class="data-tbl" id="phases-tbl">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Line Item</th>
            <th>Product ID</th>
            <th>Phase</th>
            <th>WC Status</th>
            <th>History</th>
          </tr>
        </thead>
        <tbody id="phases-body">
          <tr class="loading-row"><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="phases-pages"></div>
  </div>

  <!-- ══════════════════════════════
       TAB: PRODUCTS
  ══════════════════════════════ -->
  <div class="tab-panel" id="panel-products">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-products" placeholder="Search name, material, ID…" oninput="filterProducts()">
      </div>
      <select id="filter-prod-mat" onchange="filterProducts()" style="font-size:12px;padding:6px 10px;border:1px solid #e8ddd4;border-radius:8px;background:#f5f0eb;color:#555;outline:none;">
        <option value="">All Materials</option>
      </select>
      <span class="count-label" id="products-count-label"></span>
      <button class="topbar-btn" onclick="loadProducts()">↺ Refresh</button>
    </div>
    <div class="tbl-wrap">
      <table class="data-tbl" id="products-tbl">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Material</th>
            <th>Stock</th>
            <th>BOM Parts</th>
            <th>WC ID</th>
          </tr>
        </thead>
        <tbody id="products-body">
          <tr class="loading-row"><td colspan="6">Click the tab to load…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="products-pages"></div>
  </div>

  <!-- ══════════════════════════════
       TAB: PRODUCTS V2
  ══════════════════════════════ -->
  <div class="tab-panel" id="panel-products_v2">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-products_v2" placeholder="Search name, SKU, material…" oninput="filterProductsV2()">
      </div>
      <select id="filter-v2-mat" onchange="filterProductsV2()" style="font-size:12px;padding:6px 10px;border:1px solid #e8ddd4;border-radius:8px;background:#f5f0eb;color:#555;outline:none;">
        <option value="">All Materials</option>
      </select>
      <span class="count-label" id="products_v2-count-label"></span>
      <button class="topbar-btn" onclick="loadProductsV2()">↺ Refresh</button>
    </div>
    <div class="tbl-wrap">
      <table class="data-tbl" id="products_v2-tbl">
        <thead>
          <tr>
            <th>Doc ID</th>
            <th>Name</th>
            <th>SKU / WC ID</th>
            <th>Material</th>
            <th>Parts</th>
            <th>Phase Group</th>
          </tr>
        </thead>
        <tbody id="products_v2-body">
          <tr class="loading-row"><td colspan="6">Click the tab to load…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="products_v2-pages"></div>
  </div>

</div><!-- /page-body -->

<script>
  const FS_KEY  = 'AIzaSyBXREsAkKX25cK5t5EiCrPpGv4zSaBMOgg';
  const FS_BASE = 'https://firestore.googleapis.com/v1/projects/timbered-dashboard/databases/(default)/documents';

  const PAGE_SIZE = 50;

  // ─────────────────────────────────────────
  //  Shared helpers
  // ─────────────────────────────────────────
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let _toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type}`;
    clearTimeout(_toastTimer);
    if (type !== 'saving') _toastTimer = setTimeout(() => el.className = 'toast hidden', 2500);
  }

  function fv(fields, key) {
    const f = fields?.[key];
    if (!f) return '';
    return f.stringValue ?? f.integerValue ?? f.doubleValue ?? f.booleanValue ?? '';
  }

  async function fsQuery(collectionId) {
    const res = await fetch(`${FS_BASE}:runQuery?key=${FS_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId }] } })
    });
    const rows = await res.json();
    return rows.filter(r => r.document);
  }

  // ─────────────────────────────────────────
  //  Tab switching
  // ─────────────────────────────────────────
  const _loaded = { phases: false, products: false, products_v2: false };
  let _activeTab = 'phases';

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    _activeTab = tab;
    if (!_loaded[tab]) {
      if (tab === 'phases')      loadPhases();
      if (tab === 'products')    loadProducts();
      if (tab === 'products_v2') loadProductsV2();
    }
  }

  // ─────────────────────────────────────────
  //  ORDER PHASES
  // ─────────────────────────────────────────
  let _phases = [];
  let _phasesFiltered = [];
  let _phasePage = 0;

  async function loadPhases() {
    _loaded.phases = true;
    document.getElementById('phases-body').innerHTML =
      '<tr class="loading-row"><td colspan="6">Loading from Firebase…</td></tr>';
    try {
      const rows = await fsQuery('order_phases');
      _phases = rows.map(r => {
        const f = r.document.fields || {};
        const history = (f.history?.arrayValue?.values || []).map(v => ({
          phase: v.mapValue?.fields?.phase?.stringValue || '',
          at:    v.mapValue?.fields?.at?.stringValue || null,
        }));
        return {
          docId:      r.document.name.split('/').pop(),
          order_id:   fv(f, 'order_id'),
          line_item:  fv(f, 'line_item_id'),
          product_id: fv(f, 'product_id'),
          phase:      fv(f, 'phase'),
          wc_status:  fv(f, 'wc_status'),
          history,
        };
      }).sort((a, b) => Number(b.order_id) - Number(a.order_id));

      // populate status filter
      const statuses = [...new Set(_phases.map(p => p.wc_status).filter(Boolean))].sort();
      const sel = document.getElementById('filter-phase-status');
      sel.innerHTML = '<option value="">All WC Statuses</option>' +
        statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      document.getElementById('cnt-phases').textContent = _phases.length;
      filterPhases();
    } catch (e) {
      document.getElementById('phases-body').innerHTML =
        `<tr class="empty-row"><td colspan="6">Error: ${esc(e.message)}</td></tr>`;
      showToast('Failed to load phases', 'err');
    }
  }

  function filterPhases() {
    const q     = document.getElementById('search-phases').value.toLowerCase();
    const sts   = document.getElementById('filter-phase-status').value;
    _phasesFiltered = _phases.filter(p => {
      if (sts && p.wc_status !== sts) return false;
      if (q) {
        const hay = `${p.order_id} ${p.line_item} ${p.product_id} ${p.phase} ${p.wc_status}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    _phasePage = 0;
    renderPhases();
  }

  function renderPhases() {
    const start = _phasePage * PAGE_SIZE;
    const page  = _phasesFiltered.slice(start, start + PAGE_SIZE);
    const body  = document.getElementById('phases-body');

    if (!_phasesFiltered.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="6">No records match.</td></tr>';
      document.getElementById('phases-pages').innerHTML = '';
      document.getElementById('phases-count-label').textContent = '0 records';
      return;
    }

    document.getElementById('phases-count-label').textContent =
      `${_phasesFiltered.length.toLocaleString()} records`;

    body.innerHTML = page.map((p, i) => {
      const rid = `ph-${start + i}`;
      const histLabel = p.history.length
        ? `<button class="expand-btn" onclick="toggleSub('${rid}')">▶ ${p.history.length} entries</button>`
        : '<span class="no-history">—</span>';
      const statusCls = p.wc_status ? ` ${p.wc_status.toLowerCase().replace(/[^a-z]/g,'-')}` : '';
      return `
        <tr>
          <td><code style="font-size:12px">${esc(p.order_id)}</code></td>
          <td><code style="font-size:12px">${esc(p.line_item)}</code></td>
          <td style="color:#aaa;font-size:12px">${esc(p.product_id)}</td>
          <td><span class="badge badge-phase">${esc(p.phase) || '—'}</span></td>
          <td>${p.wc_status ? `<span class="badge badge-status${statusCls}">${esc(p.wc_status)}</span>` : '<span style="color:#ccc">—</span>'}</td>
          <td>${histLabel}</td>
        </tr>
        <tr class="sub-row" id="${rid}">
          <td class="sub-cell" colspan="6">
            ${p.history.length ? `
            <table class="sub-table">
              <thead><tr><th>#</th><th>Phase</th><th>Timestamp</th></tr></thead>
              <tbody>
                ${p.history.map((h, j) => `
                  <tr>
                    <td style="color:#bbb">${j + 1}</td>
                    <td>${esc(h.phase)}</td>
                    <td style="color:#aaa">${h.at ? new Date(h.at).toLocaleString() : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>` : '<span class="no-history">No history entries.</span>'}
          </td>
        </tr>`;
    }).join('');

    renderPagination('phases-pages', _phasesFiltered.length, _phasePage, pg => { _phasePage = pg; renderPhases(); });
  }

  // ─────────────────────────────────────────
  //  PRODUCTS
  // ─────────────────────────────────────────
  let _products = [];
  let _productsFiltered = [];
  let _prodPage = 0;

  async function loadProducts() {
    _loaded.products = true;
    document.getElementById('products-body').innerHTML =
      '<tr class="loading-row"><td colspan="6">Loading from Firebase…</td></tr>';
    try {
      const rows = await fsQuery('products');
      _products = rows.map(r => {
        const f = r.document.fields || {};
        const bom = (f.bom?.arrayValue?.values || f.parts?.arrayValue?.values || []).map(v => {
          const pf = v.mapValue?.fields || {};
          return {
            desc:      pf.description?.stringValue || pf.name?.stringValue || '',
            qty:       pf.qty?.integerValue || pf.qty?.doubleValue || '',
            length:    pf.length?.doubleValue || pf.length?.integerValue || '',
            width:     pf.width?.doubleValue  || pf.width?.integerValue  || '',
            thickness: pf.thickness?.doubleValue || pf.thickness?.integerValue || '',
          };
        });
        return {
          docId:    r.document.name.split('/').pop(),
          name:     fv(f, 'name'),
          material: fv(f, 'material'),
          stock:    fv(f, 'stock_count') || fv(f, 'stock'),
          wc_id:    fv(f, 'wc_id') || fv(f, 'id'),
          image:    f.image?.stringValue || '',
          bom,
        };
      }).sort((a, b) => a.name.localeCompare(b.name));

      // material filter
      const mats = [...new Set(_products.map(p => p.material).filter(Boolean))].sort();
      const sel = document.getElementById('filter-prod-mat');
      sel.innerHTML = '<option value="">All Materials</option>' +
        mats.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');

      document.getElementById('cnt-products').textContent = _products.length;
      filterProducts();
    } catch (e) {
      document.getElementById('products-body').innerHTML =
        `<tr class="empty-row"><td colspan="6">Error: ${esc(e.message)}</td></tr>`;
      showToast('Failed to load products', 'err');
    }
  }

  function filterProducts() {
    const q   = document.getElementById('search-products').value.toLowerCase();
    const mat = document.getElementById('filter-prod-mat').value;
    _productsFiltered = _products.filter(p => {
      if (mat && p.material !== mat) return false;
      if (q) {
        const hay = `${p.name} ${p.material} ${p.docId} ${p.wc_id}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    _prodPage = 0;
    renderProducts();
  }

  function renderProducts() {
    const start = _prodPage * PAGE_SIZE;
    const page  = _productsFiltered.slice(start, start + PAGE_SIZE);
    const body  = document.getElementById('products-body');

    if (!_productsFiltered.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="6">No records match.</td></tr>';
      document.getElementById('products-pages').innerHTML = '';
      document.getElementById('products-count-label').textContent = '0 records';
      return;
    }

    document.getElementById('products-count-label').textContent =
      `${_productsFiltered.length.toLocaleString()} records`;

    body.innerHTML = page.map((p, i) => {
      const rid = `pr-${start + i}`;
      const bomLabel = p.bom.length
        ? `<button class="expand-btn" onclick="toggleSub('${rid}')">▶ ${p.bom.length} parts</button>`
        : '<span style="color:#ccc;font-size:12px">—</span>';
      return `
        <tr>
          <td style="font-size:11px;color:#aaa">${esc(p.docId)}</td>
          <td style="font-weight:600">${esc(p.name) || '<em style="color:#ccc">unnamed</em>'}</td>
          <td>${p.material ? `<span class="badge badge-mat">${esc(p.material)}</span>` : '<span style="color:#ccc">—</span>'}</td>
          <td style="text-align:center">${p.stock !== '' ? p.stock : '<span style="color:#ccc">—</span>'}</td>
          <td>${bomLabel}</td>
          <td style="font-size:11px;color:#aaa">${esc(p.wc_id) || '—'}</td>
        </tr>
        <tr class="sub-row" id="${rid}">
          <td class="sub-cell" colspan="6">
            ${p.bom.length ? `
            <table class="sub-table">
              <thead><tr><th>#</th><th>Description</th><th>L</th><th>W</th><th>T</th><th>Qty</th></tr></thead>
              <tbody>
                ${p.bom.map((b, j) => `
                  <tr>
                    <td style="color:#bbb">${j + 1}</td>
                    <td>${esc(b.desc)}</td>
                    <td>${b.length || '—'}</td>
                    <td>${b.width  || '—'}</td>
                    <td>${b.thickness || '—'}</td>
                    <td>${b.qty || '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>` : '<span class="no-history">No BOM parts.</span>'}
          </td>
        </tr>`;
    }).join('');

    renderPagination('products-pages', _productsFiltered.length, _prodPage, pg => { _prodPage = pg; renderProducts(); });
  }

  // ─────────────────────────────────────────
  //  PRODUCTS V2
  // ─────────────────────────────────────────
  let _productsV2 = [];
  let _productsV2Filtered = [];
  let _v2Page = 0;

  async function loadProductsV2() {
    _loaded.products_v2 = true;
    document.getElementById('products_v2-body').innerHTML =
      '<tr class="loading-row"><td colspan="6">Loading from Firebase…</td></tr>';
    try {
      const rows = await fsQuery('products_v2');
      _productsV2 = rows.map(r => {
        const f = r.document.fields || {};
        const parts = (f.parts?.arrayValue?.values || []).map(v => {
          const pf = v.mapValue?.fields || {};
          return {
            desc:      pf.description?.stringValue || pf.name?.stringValue || '',
            qty:       pf.qty?.integerValue ?? pf.qty?.doubleValue ?? '',
            length:    pf.length?.doubleValue ?? pf.length?.integerValue ?? '',
            width:     pf.width?.doubleValue  ?? pf.width?.integerValue  ?? '',
            thickness: pf.thickness?.doubleValue ?? pf.thickness?.integerValue ?? '',
          };
        });
        return {
          docId:       r.document.name.split('/').pop(),
          name:        fv(f, 'name'),
          sku:         fv(f, 'sku'),
          wc_id:       fv(f, 'wc_id') || fv(f, 'id'),
          material:    fv(f, 'material'),
          phase_group: fv(f, 'phase_group'),
          parts,
        };
      }).sort((a, b) => a.name.localeCompare(b.name));

      // material filter
      const mats = [...new Set(_productsV2.map(p => p.material).filter(Boolean))].sort();
      const sel = document.getElementById('filter-v2-mat');
      sel.innerHTML = '<option value="">All Materials</option>' +
        mats.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');

      document.getElementById('cnt-products_v2').textContent = _productsV2.length;
      filterProductsV2();
    } catch (e) {
      document.getElementById('products_v2-body').innerHTML =
        `<tr class="empty-row"><td colspan="6">Error: ${esc(e.message)}</td></tr>`;
      showToast('Failed to load products v2', 'err');
    }
  }

  function filterProductsV2() {
    const q   = document.getElementById('search-products_v2').value.toLowerCase();
    const mat = document.getElementById('filter-v2-mat').value;
    _productsV2Filtered = _productsV2.filter(p => {
      if (mat && p.material !== mat) return false;
      if (q) {
        const hay = `${p.name} ${p.sku} ${p.material} ${p.docId} ${p.wc_id} ${p.phase_group}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    _v2Page = 0;
    renderProductsV2();
  }

  function renderProductsV2() {
    const start = _v2Page * PAGE_SIZE;
    const page  = _productsV2Filtered.slice(start, start + PAGE_SIZE);
    const body  = document.getElementById('products_v2-body');

    if (!_productsV2Filtered.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="6">No records match.</td></tr>';
      document.getElementById('products_v2-pages').innerHTML = '';
      document.getElementById('products_v2-count-label').textContent = '0 records';
      return;
    }

    document.getElementById('products_v2-count-label').textContent =
      `${_productsV2Filtered.length.toLocaleString()} records`;

    body.innerHTML = page.map((p, i) => {
      const rid = `v2-${start + i}`;
      const partsLabel = p.parts.length
        ? `<button class="expand-btn" onclick="toggleSub('${rid}')">▶ ${p.parts.length} parts</button>`
        : '<span style="color:#ccc;font-size:12px">—</span>';
      const skuLine = [p.sku, p.wc_id ? `#${p.wc_id}` : ''].filter(Boolean).join(' / ') || '—';
      return `
        <tr>
          <td style="font-size:11px;color:#aaa">${esc(p.docId)}</td>
          <td style="font-weight:600">${esc(p.name) || '<em style="color:#ccc">unnamed</em>'}</td>
          <td style="font-size:12px;color:#888">${esc(skuLine)}</td>
          <td>${p.material ? `<span class="badge badge-mat">${esc(p.material)}</span>` : '<span style="color:#ccc">—</span>'}</td>
          <td>${partsLabel}</td>
          <td style="font-size:12px;color:#888">${esc(p.phase_group) || '—'}</td>
        </tr>
        <tr class="sub-row" id="${rid}">
          <td class="sub-cell" colspan="6">
            ${p.parts.length ? `
            <table class="sub-table">
              <thead><tr><th>#</th><th>Description</th><th>Length</th><th>Width</th><th>Thickness</th><th>Qty</th></tr></thead>
              <tbody>
                ${p.parts.map((pt, j) => `
                  <tr>
                    <td style="color:#bbb">${j + 1}</td>
                    <td>${esc(pt.desc)}</td>
                    <td>${pt.length !== '' ? pt.length : '—'}</td>
                    <td>${pt.width  !== '' ? pt.width  : '—'}</td>
                    <td>${pt.thickness !== '' ? pt.thickness : '—'}</td>
                    <td>${pt.qty !== '' ? pt.qty : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>` : '<span class="no-history">No parts.</span>'}
          </td>
        </tr>`;
    }).join('');

    renderPagination('products_v2-pages', _productsV2Filtered.length, _v2Page, pg => { _v2Page = pg; renderProductsV2(); });
  }

  // ─────────────────────────────────────────
  //  Shared: expand sub-rows
  // ─────────────────────────────────────────
  function toggleSub(rid) {
    const row = document.getElementById(rid);
    if (!row) return;
    const open = row.classList.toggle('open');
    const btn = row.previousElementSibling?.querySelector('.expand-btn');
    if (btn) btn.textContent = btn.textContent.replace(/^[▶▼]/, open ? '▼' : '▶');
  }

  // ─────────────────────────────────────────
  //  Pagination
  // ─────────────────────────────────────────
  function renderPagination(containerId, total, currentPage, onPage) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el = document.getElementById(containerId);
    if (pages <= 1) { el.innerHTML = ''; return; }

    const prev = currentPage > 0;
    const next = currentPage < pages - 1;
    el.innerHTML = `
      <button class="page-btn" ${prev ? '' : 'disabled'} onclick="(${onPage})(${currentPage - 1})">← Prev</button>
      <span class="page-info">Page ${currentPage + 1} of ${pages} · ${total.toLocaleString()} rows</span>
      <button class="page-btn" ${next ? '' : 'disabled'} onclick="(${onPage})(${currentPage + 1})">Next →</button>`;
  }

  // ─────────────────────────────────────────
  //  Init
  // ─────────────────────────────────────────
  loadPhases();
</script>
</body>
</html>
