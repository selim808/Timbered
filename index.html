<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbered Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f5f0eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .logo { height: 48px; margin-bottom: 32px; }
    .title { font-size: 18px; font-weight: 700; color: #7A4610; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #aaa; margin-bottom: 40px; }
    .cards { display: flex; gap: 16px; }
    .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 140px; height: 140px; background: #fff; border-radius: 20px; border: 2px solid #e8ddd4; text-decoration: none; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
    .card:hover { border-color: #7A4610; box-shadow: 0 4px 16px rgba(122,70,16,0.12); }
    .card .icon { width: 52px; height: 52px; object-fit: contain; }
    .card .label { font-size: 13px; font-weight: 700; color: #7A4610; }

    /* PIN overlay */
    #pin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
    #pin-overlay.open { display: flex; }
    #pin-box { background: #fff; border-radius: 20px; padding: 28px 24px; width: 260px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    #pin-box .pin-title { font-size: 15px; font-weight: 700; color: #7A4610; }
    #pin-dots { display: flex; gap: 10px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #e8ddd4; background: #fff; transition: background 0.15s, border-color 0.15s; }
    .pin-dot.filled { background: #7A4610; border-color: #7A4610; }
    .pin-dot.error { background: #e74c3c; border-color: #e74c3c; }
    #pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .pin-key { height: 52px; border: 1.5px solid #e8ddd4; border-radius: 12px; background: #fff; font-size: 18px; font-weight: 700; color: #333; cursor: pointer; transition: background 0.1s; }
    .pin-key:active { background: #fef3e2; }
    .pin-key.del { font-size: 14px; color: #888; }
    #pin-cancel { font-size: 12px; color: #aaa; background: none; border: none; cursor: pointer; margin-top: 4px; }
  </style>
</head>
<body>
  <img class="logo" src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <div class="title">Timbered Dashboard</div>
  <div class="sub">Select your role to continue</div>
  <div class="cards">
    <div class="card" onclick="openPin()">
      <img class="icon" src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="">
      <div class="label">Owner</div>
    </div>
    <a class="card" href="employee/index.html">
      <img class="icon" src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="">
      <div class="label">Employee</div>
    </a>
  </div>

  <div id="pin-overlay">
    <div id="pin-box">
      <div class="pin-title">Enter PIN</div>
      <div id="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div id="pin-keypad">
        <button class="pin-key" onclick="pinKey('1')">1</button>
        <button class="pin-key" onclick="pinKey('2')">2</button>
        <button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button>
        <button class="pin-key" onclick="pinKey('5')">5</button>
        <button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button>
        <button class="pin-key" onclick="pinKey('8')">8</button>
        <button class="pin-key" onclick="pinKey('9')">9</button>
        <div></div>
        <button class="pin-key" onclick="pinKey('0')">0</button>
        <button class="pin-key del" onclick="pinDel()">⌫</button>
      </div>
      <button id="pin-cancel" onclick="closePin()">Cancel</button>
    </div>
  </div>

  <script>
    const PIN = '1024';
    let entered = '';

    function openPin() {
      entered = '';
      updateDots();
      document.getElementById('pin-overlay').classList.add('open');
    }

    function closePin() {
      document.getElementById('pin-overlay').classList.remove('open');
    }

    function pinKey(digit) {
      if (entered.length >= 4) return;
      entered += digit;
      updateDots();
      if (entered.length === 4) {
        if (entered === PIN) {
          setTimeout(() => { window.location.href = 'owner/index.html'; }, 150);
        } else {
          showError();
        }
      }
    }

    function pinDel() {
      entered = entered.slice(0, -1);
      updateDots();
    }

    function updateDots(cls = 'filled') {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('d' + i);
        dot.className = 'pin-dot' + (i < entered.length ? ' ' + cls : '');
      }
    }

    function showError() {
      updateDots('error');
      setTimeout(() => {
        entered = '';
        updateDots();
      }, 700);
    }

    document.getElementById('pin-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('pin-overlay')) closePin();
    });
  </script>
</body>
</html>
