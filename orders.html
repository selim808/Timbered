<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabrication — Timbered</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    /* HEADER */
    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 100; }
    .site-header img { height: 26px; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
    .back { margin-left: auto; font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }

    /* SUB-NAV */
    .sub-nav { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e8ddd4; position: sticky; top: 51px; z-index: 100; }
    .sub-nav-btn { font-size: 12px; font-weight: 700; color: #aaa; text-decoration: none; padding: 8px 18px; border-bottom: 2px solid transparent; }
    .sub-nav-btn.active { color: #7A4610; border-bottom-color: #7A4610; }
    .sub-nav-btn:hover { color: #7A4610; }

    /* TOOLBAR */
    .toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e8ddd4; position: sticky; top: 83px; z-index: 99; flex-wrap: wrap; }
    .tb-group { display: flex; align-items: center; gap: 6px; }
    .tb-label { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .sort-btn { font-size: 14px; background: none; border: 1.5px solid #e8ddd4; border-radius: 8px; padding: 2px 8px; cursor: pointer; color: #7A4610; display: none; line-height: 1.4; }
    .sort-btn.visible { display: inline-block; }
    /* filter buttons */
    .filter-btn { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1.5px solid #e8ddd4; background: #fff; color: #888; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #7A4610; color: #fff; border-color: #7A4610; }
    .tb-divider { width: 1px; background: #e8ddd4; align-self: stretch; margin: 0 2px; }
    /* view buttons */
    .view-btns { display: flex; gap: 4px; }
    .view-btn { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1.5px solid #e8ddd4; background: #fff; color: #888; cursor: pointer; }
    .view-btn.active { background: #7A4610; color: #fff; border-color: #7A4610; }
    /* toggle */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #ddd; border-radius: 20px; cursor: pointer; transition: background 0.2s; }
    .toggle input:checked + .toggle-slider { background: #7A4610; }
    .toggle-slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(16px); }
    /* bulk controls */
    .bulk-phase-sel { font-size: 11px; border: 1.5px solid #e8ddd4; border-radius: 8px; padding: 3px 4px; color: #555; max-width: 90px; }
    .bulk-apply-btn { font-size: 11px; font-weight: 700; background: #7A4610; color: #fff; border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
    .bulk-apply-btn:disabled { background: #ccc; cursor: default; }

    /* STATE */
    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    /* CONTENT */
    #content { padding: 10px; }

    /* ── BY PHASE VIEW ── */
    .phase-group { background: #fff; border: 1px solid #e8ddd4; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
    .phase-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
    .phase-header:hover { background: #fdf8f4; }
    .phase-name { font-size: 13px; font-weight: 700; color: #7A4610; flex: 1; }
    .phase-meta { font-size: 11px; color: #aaa; }
    .phase-chevron { font-size: 10px; color: #bbb; transition: transform 0.2s; }
    .phase-group.open .phase-chevron { transform: rotate(180deg); }
    .phase-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
    .phase-items-inner { overflow: hidden; }
    .phase-group.open .phase-items { grid-template-rows: 1fr; }
    .phase-group.open .phase-items-inner { overflow-y: auto; max-height: 260px; }

    /* ── BY PRODUCT VIEW ── */
    .product-group { background: #fff; border: 1px solid #e8ddd4; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
    .product-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
    .product-header:hover { background: #fdf8f4; }
    .product-select-all, .group-select-all { width: 16px; height: 16px; accent-color: #7A4610; flex-shrink: 0; display: none; cursor: pointer; }
    .bulk-mode .product-select-all, .bulk-mode .group-select-all { display: block; }
    .product-name { font-size: 13px; font-weight: 700; color: #333; flex: 1; }
    .product-meta { font-size: 11px; color: #aaa; }
.product-chevron { font-size: 10px; color: #bbb; transition: transform 0.2s; }
    .product-count-lbl { font-size: 11px; font-weight: 700; color: #7A4610; background: #fef3e2; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
    .prod-sort-btns { display: flex; gap: 3px; }
    .prod-sort-btn { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1.5px solid #e8ddd4; background: #fff; color: #888; cursor: pointer; white-space: nowrap; }
    .prod-sort-btn.active { background: #7A4610; color: #fff; border-color: #7A4610; }
    .product-group.open .product-chevron { transform: rotate(180deg); }
    .product-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
    .product-items-inner { overflow: hidden; }
    .product-group.open .product-items { grid-template-rows: 1fr; }

    /* ── ITEM ROW (shared) ── */
    .item-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid #f5f0eb; }
    .item-check { width: 16px; height: 16px; accent-color: #7A4610; flex-shrink: 0; display: none; }
    .bulk-mode .item-check { display: block; }
    .d-badge { font-size: 10px; font-weight: 700; color: #fff; background: #7A4610; border-radius: 4px; padding: 1px 5px; white-space: nowrap; flex-shrink: 0; }
    .d-badge.warn   { background: #e67e22; }
    .d-badge.urgent { background: #e74c3c; }
    .item-id   { font-size: 10px; color: #aaa; white-space: nowrap; flex-shrink: 0; }
    .item-name { font-size: 12px; font-weight: 600; color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
    .item-name:hover { text-decoration: underline; color: #7A4610; }
    .note-icon { font-size: 12px; cursor: default; flex-shrink: 0; }
    .dwg-icon { font-size: 9px; font-weight: 700; color: #7A4610; border: 1.5px solid #7A4610; border-radius: 3px; padding: 1px 4px; text-decoration: none; flex-shrink: 0; white-space: nowrap; line-height: 1.4; }
    .dwg-icon:hover { background: #7A4610; color: #fff; }
    .item-qty  { font-size: 11px; color: #888; flex-shrink: 0; }
    .item-price { font-size: 11px; color: #7A4610; font-weight: 600; flex-shrink: 0; }
    .phase-sel { font-size: 11px; border: 1px solid #e8ddd4; border-radius: 6px; padding: 2px 4px; color: #555; flex-shrink: 0; max-width: 90px; }
    .bulk-mode .item-row { cursor: pointer; }
    .bulk-mode .item-row:hover { background: #fef3e2; }

    /* ── BY ORDER VIEW ── */
    .order-card { background: #fff; border: 1px solid #e8ddd4; border-radius: 8px; margin-bottom: 6px; }
    .order-top { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
    .order-name-lbl { font-size: 12px; font-weight: 700; color: #222; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order-total-lbl { font-size: 12px; font-weight: 700; color: #7A4610; white-space: nowrap; flex-shrink: 0; }
    .order-phone-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .order-phone-num  { font-size: 11px; color: #555; white-space: nowrap; }
    .order-phone-lbl  { display: flex; align-items: center; text-decoration: none; }
    .order-phone-lbl:hover svg { opacity: 0.75; }
    .order-phone-call { display: flex; align-items: center; text-decoration: none; }
    .order-phone-call:hover svg { opacity: 0.6; }
    .order-chevron { font-size: 10px; color: #bbb; flex-shrink: 0; transition: transform 0.2s; }
    .order-card.open .order-chevron { transform: rotate(180deg); }
    .order-addr-lbl { font-size: 11px; color: #999; padding: 0 10px 6px; display: flex; gap: 6px; }
    .order-addr-lbl .a1 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .order-addr-lbl .a2 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .order-addr-lbl .a3 { flex-shrink:0; white-space:nowrap; font-weight:600; color:#7A4610; }
    .order-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
    .order-items-inner { overflow: hidden; }
    .order-card.open .order-items { grid-template-rows: 1fr; }
    .order-card.selected { border-color: #7A4610; background: #fef8f2; }
    /* order checkbox */
    .order-sel-check { width: 16px; height: 16px; accent-color: #1a7a3c; flex-shrink: 0; cursor: pointer; display: none; }

    /* completed filter button */
    .completed-wrap { position: relative; }
    .completed-row { display: none; flex-direction: row; gap: 4px; }
    .completed-row.visible { display: flex; }
    /* default (wrapped toolbar): cancel stacked above complete */
    .cancel-filter { position: static; }
    /* single-row toolbar: cancel inline with complete */
    @media (min-width: 700px) {
      .cancel-filter { position: static; }
    }
    .completed-filter { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1.5px solid #1a7a3c; background: #1a7a3c; color: #fff; cursor: pointer; white-space: nowrap; }
    .completed-filter.selecting { background: #145e2d; border-color: #145e2d; }
    .cancel-filter { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1.5px solid #c0392b; background: #c0392b; color: #fff; cursor: pointer; white-space: nowrap; }
    .cancel-filter.selecting { background: #922b21; border-color: #922b21; }
    /* selection bar */
    .completed-bar { display: none; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid; position: sticky; top: 83px; z-index: 97; }
    .completed-bar.complete-mode { background: #e8f5ee; border-color: #b7dfc8; }
    .completed-bar.cancel-mode  { background: #fdecea; border-color: #f1a9a0; }
    .completed-bar.visible { display: flex; }
    .completed-bar-msg { font-size: 12px; color: #1a7a3c; font-weight: 600; flex: 1; }

    /* modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 14px; padding: 24px 20px; max-width: 320px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal-title { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 10px; }
    .modal-body { font-size: 13px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-btn { font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer; }
    .modal-btn.yes { background: #27ae60; color: #fff; }
    .modal-btn.no  { background: #e8ddd4; color: #555; }
    .modal-btn.edit { background: #7A4610; color: #fff; }
    .modal-btn:disabled { opacity: 0.6; cursor: default; }

    /* item thumbnail */
    .item-thumb { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; flex-shrink: 0; cursor: pointer; border: 1px solid #e8ddd4; }
    .item-thumb-placeholder { width: 28px; height: 28px; border-radius: 5px; background: #f0e8e0; flex-shrink: 0; }

    /* order detail popup */
    .od-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:400; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
    .od-overlay.open { display:flex; }
    .od-box { background:#fff; border-radius:14px; width:100%; max-width:480px; overflow:hidden; cursor:default; margin:auto; }
    .od-header { background:#7A4610; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
    .od-header-id { font-size:13px; font-weight:700; }
    .od-header-date { font-size:11px; opacity:0.75; margin-left:auto; }
    .od-close { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:0 2px; line-height:1; margin-left:8px; }
    .od-section { padding:10px 16px; border-bottom:1px solid #f0e8e0; }
    .od-section:last-child { border-bottom:none; }
    .od-label { font-size:10px; color:#aaa; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; }
    .od-val { font-size:12px; color:#333; }
    .od-items-table { width:100%; border-collapse:collapse; font-size:11px; }
    .od-items-table th { text-align:left; color:#aaa; font-weight:700; font-size:10px; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid #f0e8e0; }
    .od-items-table td { padding:5px 6px; border-bottom:1px solid #f8f4f0; vertical-align:top; }
    .od-items-table tr:last-child td { border-bottom:none; }
    .od-total-row { display:flex; justify-content:space-between; padding:10px 16px; background:#fef3e2; font-size:13px; font-weight:700; color:#7A4610; }

    /* photo popup */
    .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; cursor: pointer; }
    .photo-overlay.open { display: flex; }
    .photo-popup { background: #fff; border-radius: 14px; padding: 14px; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; gap: 10px; cursor: default; }
    .photo-popup img { max-width: min(420px, 85vw); max-height: 70vh; object-fit: contain; border-radius: 8px; display: block; }
    .photo-popup-name { font-size: 13px; font-weight: 700; color: #333; text-align: center; }
    .photo-popup-meta { display: flex; flex-direction: column; gap: 4px; }
    .photo-popup-meta span { font-size: 12px; color: #666; text-align: center; }
    .photo-popup-meta strong { color: #333; }

    /* SUB-NAV buttons */
    .sub-nav-btn { background: none; border: none; cursor: pointer; }

    /* KANBAN SLIDER */
    #kb-slider-wrap { display: none; padding: 4px 12px 10px; background: #f5f0eb; }
    #kb-slider { width: 100%; accent-color: #7A4610; cursor: pointer; }
    #wip-chart-wrap { display: none; padding: 16px 12px; }
    #wip-chart-wrap .wip-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    #wip-chart-wrap .wip-kpi { background: #fff; border: 1px solid #e8ddd4; border-radius: 8px; padding: 8px 14px; flex: 1; min-width: 120px; }
    #wip-chart-wrap .wip-kpi-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    #wip-chart-wrap .wip-kpi-value { font-size: 18px; font-weight: 700; color: #7A4610; margin-top: 2px; }
    #wip-chart-box { background: #fff; border: 1px solid #e8ddd4; border-radius: 8px; height: 360px; position: relative; }
    #wip-chart-box canvas { cursor: pointer; }
    .nr-checklist { padding: 8px 12px 10px; border-top: 1px solid #f0e8e0; display: flex; flex-direction: column; gap: 5px; }
    .nr-cl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nr-cl-day { font-size: 10px; font-weight: 700; color: #7A4610; text-transform: uppercase; letter-spacing: 0.4px; min-width: 28px; }
    .nr-check-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #555; cursor: pointer; user-select: none; }
    .nr-check-item input[type=checkbox] { accent-color: #7A4610; width: 13px; height: 13px; cursor: pointer; }
    .nr-check-item.done span { color: #27ae60; text-decoration: line-through; }

    /* KANBAN */
    #kb-filter-bar { display: none; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e8ddd4; gap: 6px; flex-wrap: wrap; }
    #kb-filter-bar.visible { display: flex; }
    .kb-filter-btn { font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; border: 1.5px solid #e8ddd4; background: #fff; color: #888; cursor: pointer; }
    .kb-filter-btn.active { background: #7A4610; color: #fff; border-color: #7A4610; }
    .kb-col.hidden { display: none; }
    #kanban-wrap { display: none; overflow: auto; padding: 12px; padding-right: 0; touch-action: pan-x pan-y; }
    #kb-end-spacer { min-width: 12px; flex-shrink: 0; }
    .kb-board { display: flex; gap: 10px; align-items: flex-start; min-width: max-content; transform-origin: top left; transition: transform 0.05s; }
    .kb-col { width: 180px; flex-shrink: 0; background: #fff; border-radius: 10px; border: 1px solid #e8ddd4; }
    .kb-col-header { padding: 8px 10px; border-bottom: 1px solid #f0e8e0; }
    .kb-col-title { font-size: 10px; font-weight: 700; color: #7A4610; text-transform: uppercase; letter-spacing: 0.4px; }
    .kb-col-count { font-size: 10px; color: #aaa; margin-top: 2px; }
    .kb-col-body { padding: 6px; min-height: 60px; display: flex; flex-direction: column; gap: 5px; }
    .kb-col-body.drag-over { background: #fef3e2; border-radius: 0 0 10px 10px; }
    .kb-card { background: #fafafa; border: 1px solid #e8ddd4; border-radius: 7px; padding: 7px 9px; cursor: grab; user-select: none; }
    .kb-card:active { cursor: grabbing; }
    .kb-card.dragging { opacity: 0.4; }
    .kb-card-days { font-size: 10px; font-weight: 700; color: #fff; background: #7A4610; border-radius: 4px; display: inline-block; padding: 1px 5px; margin-bottom: 4px; }
    .kb-card-days.warn { background: #e67e22; }
    .kb-card-days.urgent { background: #e74c3c; }
    .kb-card-id   { font-size: 10px; color: #aaa; margin-bottom: 2px; }
    .kb-card-name { font-size: 11px; font-weight: 600; color: #333; line-height: 1.3; }
    .kb-card-qty  { font-size: 10px; color: #888; margin-top: 3px; }
  </style>
</head>
<body>

<div class="site-header">
  <a href="index.html"><img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered" style="display:block;"></a>
  <span class="title">Orders</span>
  <span class="badge" id="itemCount">Loading…</span>
  <span class="badge" id="totalValue" style="background:#e8f5ee;color:#1a7a3c;border-color:#b7dfc8;"></span>
  <a href="index.html" class="back">← Back</a>
</div>

<div class="sub-nav">
  <button class="sub-nav-btn active" id="tabFab">Orders</button>
  <button class="sub-nav-btn" id="tabKanban">Kanban</button>
  <button class="sub-nav-btn" id="tabWipChart">WIP Chart</button>
  <button class="sub-nav-btn" id="tabNoResponse">No Response</button>
</div>

<div class="toolbar">
  <div class="tb-group">
    <span class="tb-label">Phases</span>
    <div style="display:grid;grid-template-columns:repeat(3,auto);gap:4px;">
      <button class="filter-btn active" data-phase-group="order-review">Order Review</button>
      <button class="filter-btn active" data-phase-group="production">Production</button>
      <button class="filter-btn active" data-phase-group="prod-wh">Prod-WH Interface</button>
      <button class="filter-btn active" data-phase-group="in-delivery">In Delivery</button>
      <button class="filter-btn active" data-phase-group="wh">WH</button>
      <button class="filter-btn active" data-phase-group="delivered">Delivered</button>
    </div>
  </div>
  <div class="tb-group">
    <span class="tb-label">Bulk</span>
    <label class="toggle">
      <input type="checkbox" id="bulkToggle">
      <span class="toggle-slider"></span>
    </label>
    <select class="bulk-phase-sel" id="bulkPhaseSel"></select>
    <button class="bulk-apply-btn" id="bulkApplyBtn" disabled>Apply</button>
    <button class="filter-btn" id="noteFilterBtn" title="Show only items with customer note">📝 Notes</button>
  </div>
  <div class="tb-group" style="flex-basis:100%;">
    <span class="tb-label">Group by</span>
    <div class="view-btns">
      <button class="view-btn" data-view="phase">Phase</button>
      <button class="view-btn" data-view="product">Product</button>
      <button class="view-btn active" data-view="order">Order</button>
    </div>
    <select id="phaseFilterSel" style="display:none; font-size:11px; border:1.5px solid #e8ddd4; border-radius:8px; padding:3px 6px; color:#555;"></select>
    <button class="sort-btn" id="sortBtn" title="Toggle sort">↑</button>
    <span class="product-count-lbl" id="productCountLbl" style="display:none;"></span>
    <div class="prod-sort-btns" id="prodSortBtns" style="display:none;">

  let _phasesFS   = {}; // `${orderId}_${lineItemId}` → phase
  let _productsFS = {}; // productId → { drawing_url, stock_qty, ... }

  async function loadPhasesFS() {
    try {
      const res = await fetch(`${FS_BASE}:runQuery?key=${FS_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'order_phases' }] } })
      });
      const rows = await res.json();
      rows.filter(r => r.document).forEach(r => {
        const f = r.document.fields || {};
        const oid = f.order_id?.stringValue || '';
        const lid = f.line_item_id?.stringValue || '';
        const ph  = f.phase?.stringValue || '';
        if (oid && lid && ph) _phasesFS[`${oid}_${lid}`] = ph;
      });
    } catch(_) {}
  }

  async function loadProductsFS() {
    try {
      const res = await fetch(`${FS_BASE}:runQuery?key=${FS_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'products' }] } })
      });
      const rows = await res.json();
      rows.filter(r => r.document).forEach(r => {
        const f = r.document.fields || {};
        const pid = f.product_id?.integerValue;
        if (pid) _productsFS[parseInt(pid)] = {
          drawing_url: f.drawing_url?.stringValue || '',
          stock_qty:   parseInt(f.stock_qty?.integerValue ?? 0),
          name:        f.name?.stringValue || '',
          image_url:   f.image_url?.stringValue || ''
        };
      });
    } catch(_) {}
  }

  // ── Phase helpers ────────────────────────────────────────────────
  function getItemPhase(orderId, itemId) {
    if (_phasesFS[`${orderId}_${itemId}`]) return _phasesFS[`${orderId}_${itemId}`];
    const order = (allOrders || []).find(o => String(o.id) === String(orderId));
    if (!order) return 'Created';
    const item = order.line_items.find(i => String(i.id) === String(itemId));
    return (item?.meta_data || []).find(m => m.key === 'tg_phase')?.value || 'Created';
  }
  function setItemPhase(orderId, itemId, phase) {
    // Update in-memory
    const order = (allOrders || []).find(o => String(o.id) === String(orderId));
    if (order) {
      const item = order.line_items.find(i => String(i.id) === String(itemId));
      if (item) {
        const existing = (item.meta_data || []).find(m => m.key === 'tg_phase');
        if (existing) existing.value = phase;
        else { if (!item.meta_data) item.meta_data = []; item.meta_data.push({ key: 'tg_phase', value: phase }); }
      }
    }
    _phasesFS[`${orderId}_${itemId}`] = phase;
    const productId = order?.line_items.find(i => String(i.id) === String(itemId))?.product_id || 0;
    fetch(`${FS_BASE}/order_phases/${orderId}_${itemId}?key=${FS_KEY}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: {
        order_id:     { stringValue: String(orderId) },
        line_item_id: { stringValue: String(itemId) },
        product_id:   { integerValue: String(productId) },
        phase:        { stringValue: phase }
      }})
    }).catch(() => {});
  }

  // ── Fetch ─────────────────────────────────────────────────────────
  async function fetchAllOrders() {
    const first      = await fetch(WC_BASE + '&page=1');
    const totalPages = parseInt(first.headers.get('X-WP-TotalPages') || '1');
    const firstRows  = await first.json();
    const rest = totalPages > 1
        ? await Promise.all(Array.from({ length: totalPages - 1 }, (_, i) =>
            fetch(WC_BASE + '&page=' + (i + 2)).then(r => r.json())))
        : [];
    return [firstRows, ...rest].flat();
  }

        d.height ? `H: ${d.height}` : '',

        a.name.toLowerCase().includes('material') ||
        a.name.toLowerCase().includes('خامة') ||
        a.name.toLowerCase().includes('wood')
      )?.options?.join(', ') || null;

        dimensions ? `<span><strong>Dimensions:</strong> ${dimensions}</span>` : '',

  // ── Views ─────────────────────────────────────────────────────────
  function renderPhaseView(items) {
    const phases = phaseFilterVal ? [phaseFilterVal] : activePhases();
    const groups = {};
    phases.forEach(p => groups[p] = []);
    items.forEach(({ order, item, idx, days }) => {
      const phase = getItemPhase(order.id, item.id);
      if (groups[phase]) groups[phase].push({ order, item, idx, days });
    });

    return phases.map(phase => {
      const list = groups[phase];
      if (!list.length) return '';
      const total = list.reduce((s, { item }) => s + parseFloat(item.total || 0), 0);
      const sorted = [...list].sort((a, b) => b.days - a.days);

      return `<div class="phase-group" data-group-key="phase-${phase}">
        <div class="phase-header" onclick="this.closest('.phase-group').classList.toggle('open')">
          <input type="checkbox" class="group-select-all" onclick="event.stopPropagation(); selectAllInGroup(this)" title="Select all">
          <span class="phase-name">${phase}</span>
          <span class="phase-meta">${list.length} item${list.length!==1?'s':''} · ${Math.round(total/1000)}K</span>
          <span class="phase-chevron">▼</span>
        </div>
        <div class="phase-items"><div class="phase-items-inner">
          ${sorted.map(({ order, item, idx, days }) => itemRowHtml(order, item, idx, days)).join('')}
        </div></div>
      </div>`;
    }).join('');
  }

    const phases = activePhases();

          </div>
          <div class="product-items"><div class="product-items-inner">
            ${[...list].sort((a,b) => {
                const pi = x => ALL_PHASES.indexOf(getItemPhase(x.order.id, x.item.id));
                return pi(a) - pi(b);
              }).map(({ order, item, idx, days }) => itemRowHtml(order, item, idx, days)).join('')}
          </div></div>
        </div>`;
      }).join('');
  }

  function renderOrderView(orders_raw) {
    const phases = activePhases();
    return orders_raw.map(o => {
      const days = daysSince(o.date_created);
      const name = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ');
      const addr1 = o.billing.address_1 || '';
      const addr2 = o.billing.address_2 || '';
      const state = EG_STATES[o.billing.state] || o.billing.state || '';
      const visibleItems = o.line_items.filter((item, idx) => phases.includes(getItemPhase(o.id, item.id)));
      if (o.line_items.length > 0 && !visibleItems.length) return '';
      const itemsHtml = visibleItems.length
        ? visibleItems.map((item, idx) => itemRowHtml(o, item, idx, days)).join('')
        : '<div style="padding:10px 14px;font-size:11px;color:#aaa;font-style:italic;">No items in this order</div>';
      const hasCreated = o.line_items.some(item => getItemPhase(o.id, item.id) === 'Created');
      const waNum = o.billing.phone.replace(/\D/g,'').replace(/^0/,'20');

          ${o.billing.phone ? `

              </a>
              <span class="order-phone-num">${o.billing.phone}</span>
              <a class="order-phone-call" href="tel:${o.billing.phone}" title="Call">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.02 1.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
              </a>
            </span>` : '<span class="order-phone-num">—</span>'}
          <span class="order-chevron">▼</span>
        </div>
        <div class="order-addr-lbl">

      </div>`;
    }).join('');
  }

  // ── Init ──────────────────────────────────────────────────────────
  let currentView = 'order';
  let sortAsc = true;
  const PHASE_GROUPS = {
    'order-review': ORDER_REVIEW_PHASES,
    'planning':     PLANNING_PHASES,
    'production':   FAB_PHASES,
    'repair':       REPAIR_PHASES,
    'dispatch':     DISPATCH_PHASES,
    'prod-wh':      PROD_WH_PHASES,
    'wh':           WH_PHASES,
    'in-delivery':  DELIVERY_KB_PHASES,
    'delivered':    DELIVERED_KB_PHASES,
  };
  const activeGroups = new Set(Object.keys(PHASE_GROUPS));
  let allItems = [], allOrders = [];
  let grandTotal = 0, grandQty = 0;
  const selectedOrderIds = new Set();

  function searchQuery() {
    return (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  }
  function orderMatches(o, q) {
    const name = [o.billing.first_name, o.billing.last_name].join(' ').toLowerCase();
    const phone = (o.billing.phone || '').toLowerCase();
    return String(o.id).includes(q) || phone.includes(q) || name.includes(q);
  }
  function filteredItems() {
    const q = searchQuery();
    let items = allItems;
    if (q) items = items.filter(({ order, item }) =>
      item.name.toLowerCase().includes(q) || orderMatches(order, q));
    if (noteFilterOn) items = items.filter(({ order }) => order.customer_note);
    return items;
  }
  function filteredOrders() {
    const q = searchQuery();
    let orders = allOrders;
    if (q) orders = orders.filter(o =>
      orderMatches(o, q) || o.line_items.some(item => item.name.toLowerCase().includes(q)));
    if (noteFilterOn) orders = orders.filter(o => o.customer_note);
    return orders;
  }

  function activePhases() {
    const phases = [];
    for (const [key, arr] of Object.entries(PHASE_GROUPS)) {
      if (activeGroups.has(key)) phases.push(...arr);
    }
    return phases;
  }

  // Search
  document.getElementById('searchInput').addEventListener('input', () => render());

  // Phase group filter buttons
  document.querySelectorAll('[data-phase-group]').forEach(btn => {
    btn.addEventListener('click', function() {
      const g = this.dataset.phaseGroup;
      if (activeGroups.has(g)) activeGroups.delete(g);
      else activeGroups.add(g);
      this.classList.toggle('active', activeGroups.has(g));

  // ── Order action flow (Complete / Cancel) ────────────────────────
  const completedBar = document.getElementById('completedBar');
  const completedBtn = document.getElementById('completedBtn');
  const cancelBtn    = document.getElementById('cancelBtn');
  const completedRow = document.getElementById('completedRow');
  let selectingMode = null; // null | 'complete' | 'cancel'

  function exitSelectingMode() {
    selectingMode = null;
    selectedOrderIds.clear();
    completedBtn.classList.remove('selecting');
    cancelBtn.classList.remove('selecting');
    completedBtn.textContent = '✓';
    cancelBtn.textContent    = '✕';
    completedBar.classList.remove('visible', 'complete-mode', 'cancel-mode');
    document.querySelectorAll('.order-sel-check').forEach(cb => cb.checked = false);
    document.querySelectorAll('.order-card').forEach(c => c.classList.remove('selected'));
  }

  function updateCompletedBar() {
    document.querySelectorAll('.order-sel-check').forEach(cb => {
      if (cb.checked) selectedOrderIds.add(String(cb.dataset.orderId));
      else selectedOrderIds.delete(String(cb.dataset.orderId));
    });
    const count = selectedOrderIds.size;
    if (selectingMode === 'complete')
      completedBtn.textContent = count > 0 ? `✓ (${count})` : '✓';
    else if (selectingMode === 'cancel')
      cancelBtn.textContent = count > 0 ? `✕ (${count})` : '✕';
    document.querySelectorAll('.order-card').forEach(card => {
      card.classList.toggle('selected', selectedOrderIds.has(String(card.dataset.orderId)));
    });
  }

  function enterMode(mode) {
    exitSelectingMode();
    selectingMode = mode;
    if (mode === 'complete') {
      completedBtn.classList.add('selecting');
      completedBar.classList.add('visible', 'complete-mode');
      document.getElementById('completedBarMsg').textContent = 'Select orders to complete';
    } else {
      cancelBtn.classList.add('selecting');
      completedBar.classList.add('visible', 'cancel-mode');
      document.getElementById('completedBarMsg').textContent = 'Select orders to cancel';
    }
    render();
  }

  function handleActionClick(mode, btn) {
    if (selectingMode !== mode) { enterMode(mode); return; }
    const count = selectedOrderIds.size;
    if (!count) { exitSelectingMode(); render(); return; }
    const totalVal = [...document.querySelectorAll('.order-sel-check:checked')]
      .reduce((s, cb) => s + parseFloat(cb.dataset.orderTotal || 0), 0);
    const action = mode === 'complete' ? 'completed' : 'cancelled';
    document.getElementById('confirmModalTitle').textContent = mode === 'complete' ? 'Mark as Completed?' : 'Mark as Cancelled?';
    document.getElementById('confirmModalBody').textContent =
      `Are you sure? ${count} order${count !== 1 ? 's' : ''} with value ${Math.round(totalVal / 1000)}K will be marked as ${action}.`;
    document.getElementById('confirmModal').dataset.action = action;
    document.getElementById('confirmModal').classList.add('open');
  }

  completedBtn.addEventListener('click', () => handleActionClick('complete', completedBtn));
  cancelBtn.addEventListener('click',    () => handleActionClick('cancel',   cancelBtn));

  document.getElementById('modalNo').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.remove('open');
  });
  document.getElementById('modalEdit').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.remove('open');
  });

  document.getElementById('modalYes').addEventListener('click', async () => {
    const checked = [...document.querySelectorAll('.order-sel-check:checked')];
    const action  = document.getElementById('confirmModal').dataset.action || 'completed';
    const yesBtn  = document.getElementById('modalYes');
    yesBtn.disabled = true;
    yesBtn.textContent = 'Saving…';
    await Promise.all(checked.map(cb =>
      fetch(WC_PUT(cb.dataset.orderId), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: action })
      }).catch(() => {})
    ));
    document.getElementById('confirmModal').classList.remove('open');
    yesBtn.disabled = false;
    yesBtn.textContent = 'Yes';
    const completedIds = new Set(checked.map(cb => String(cb.dataset.orderId)));
    allOrders = allOrders.filter(o => !completedIds.has(String(o.id)));
    allItems  = allItems.filter(({ order }) => !completedIds.has(String(order.id)));
    exitSelectingMode();
    render();
  });

  // Populate bulk phase selector
  const bulkSel = document.getElementById('bulkPhaseSel');
  ALL_PHASES.forEach(p => bulkSel.appendChild(new Option(p, p)));

  const sortBtn = document.getElementById('sortBtn');

  function getOpenGroups() {
    return [...document.querySelectorAll('.phase-group.open, .product-group.open, .order-card.open')]
      .map(el => el.dataset.groupKey);
  }
  function restoreOpenGroups(keys) {
    if (!keys.length) return;
    document.querySelectorAll('[data-group-key]').forEach(el => {
      if (keys.includes(el.dataset.groupKey)) el.classList.add('open');
    });
  }

  function render(openToKey) {
    const content = document.getElementById('content');
    const wasOpen = getOpenGroups();
    sortBtn.classList.toggle('visible', currentView === 'order');
    if (currentView === 'phase') {
      content.innerHTML = renderPhaseView(filteredItems());
    } else if (currentView === 'product') {
      content.innerHTML = renderProductView(filteredItems());
    } else {
      const sorted = [...filteredOrders()].sort((a, b) => {
        const da = daysSince(a.date_created), db = daysSince(b.date_created);
        return sortAsc ? da - db : db - da;
      });
      content.innerHTML = renderOrderView(sorted);
    }
    // Restore previously open groups + auto-open destination if provided
    const toRestore = openToKey ? [...wasOpen, openToKey] : wasOpen;
    restoreOpenGroups(toRestore);
    // Show/hide completed button (only in order view)
    completedRow.classList.toggle('visible', currentView === 'order');
    if (currentView !== 'order' && selectingMode) exitSelectingMode();
    // Show order checkboxes + restore state when in selecting mode
    if (currentView === 'order' && selectingMode) {
      document.querySelectorAll('.order-sel-check').forEach(cb => {
        cb.checked = selectedOrderIds.has(String(cb.dataset.orderId));
      });
      document.querySelectorAll('.order-sel-check').forEach(cb => {
        cb.style.display = 'block';
      });
      updateCompletedBar();
    } else {
      document.querySelectorAll('.order-sel-check').forEach(cb => { cb.style.display = 'none'; });
    }
    attachPhaseSelListeners();
  }

  sortBtn.addEventListener('click', () => {
    sortAsc = !sortAsc;
    sortBtn.textContent = sortAsc ? '↑' : '↓';
    render();
  });

  function selectAllInGroup(cb) {
    const group = cb.closest('.phase-group, .product-group, .order-card');
    if (group) group.querySelectorAll('.item-check').forEach(c => c.checked = cb.checked);
  }

  function attachPhaseSelListeners() {
    document.querySelectorAll('.phase-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        const newPhase = sel.value;
        setItemPhase(sel.dataset.order, sel.dataset.item, newPhase);
        if (currentView === 'phase') render('phase-' + newPhase); // re-sort, auto-open destination
      });
    });
  }

  // View toggle
  const productCountLbl = document.getElementById('productCountLbl');
  const prodSortBtns    = document.getElementById('prodSortBtns');
  const phaseFilterSel  = document.getElementById('phaseFilterSel');
  let productSort = 'qty'; // 'qty' | 'value'
  let phaseFilterVal = ''; // '' = all
  let noteFilterOn = false;

  function buildPhaseFilterSel() {
    phaseFilterSel.innerHTML = '<option value="">All phases</option>'
      + ALL_PHASES.map(p => `<option value="${p}">${p}</option>`).join('');
    phaseFilterSel.value = phaseFilterVal;
  }
  function updatePhaseFilterSel() {
    const show = currentView === 'phase';
    phaseFilterSel.style.display = show ? 'inline-block' : 'none';
    if (!show) phaseFilterVal = '';
  }
  phaseFilterSel.addEventListener('change', () => {
    phaseFilterVal = phaseFilterSel.value;
    render();
  });

  const noteFilterBtn = document.getElementById('noteFilterBtn');
  noteFilterBtn.addEventListener('click', () => {
    noteFilterOn = !noteFilterOn;
    noteFilterBtn.classList.toggle('active', noteFilterOn);
    render();
  });

  function updateProductCountLbl() {
    const isProduct = currentView === 'product';
    if (isProduct) {
      const count = new Set(filteredItems().map(({item}) => item.name)).size;
      productCountLbl.textContent = count + ' product' + (count !== 1 ? 's' : '');
      productCountLbl.style.display = 'inline-block';
      prodSortBtns.style.display = 'flex';
    } else {
      productCountLbl.style.display = 'none';
      prodSortBtns.style.display = 'none';
    }
  }

  document.querySelectorAll('.prod-sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.prod-sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      productSort = btn.dataset.sort;
      render();
    });
  });

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      sortBtn.textContent = sortAsc ? '↑' : '↓';
      updatePhaseFilterSel();
      render();
      updateProductCountLbl();
    });
  });

  // Bulk mode toggle
  const bulkToggle   = document.getElementById('bulkToggle');
  const bulkApplyBtn = document.getElementById('bulkApplyBtn');

  // Click anywhere on item row toggles checkbox in bulk mode
  document.getElementById('content').addEventListener('click', e => {
    if (!bulkToggle.checked) return;
    const row = e.target.closest('.item-row');
    if (!row) return;
    // Don't double-toggle if user clicked directly on the checkbox
    if (e.target.classList.contains('item-check')) return;
    const cb = row.querySelector('.item-check');
    if (cb) cb.checked = !cb.checked;
  });
  bulkToggle.addEventListener('change', () => {
    const on = bulkToggle.checked;
    document.getElementById('content').classList.toggle('bulk-mode', on);
    bulkApplyBtn.disabled = !on;
  });


  bulkApplyBtn.addEventListener('click', () => {
    const phase = bulkSel.value;
    const checked = [...document.querySelectorAll('.item-check:checked')];
    if (!checked.length) return;

    checked.forEach(cb => {
      setItemPhase(cb.dataset.order, cb.dataset.item, phase);
      cb.checked = false;
      // Update phase selector in-row without collapsing groups
      const sel = cb.closest('.item-row')?.querySelector('.phase-sel');
      if (sel) sel.value = phase;
    });

    // Phase view: items must move to new group — full re-render needed
    if (currentView === 'phase') render();
  });

  // Fetch all unique products in one request using ?include=id1,id2,...
  let _productsFetchPromise = null;
  function ensureProductsCached() {
    if (_productsFetchPromise) return _productsFetchPromise;
    const ids = [...new Set(allOrders.flatMap(o => o.line_items.map(i => i.product_id)).filter(Boolean))];
    if (!ids.length) return (_productsFetchPromise = Promise.resolve());
    const base = "https://timberedgroup.com/wp-json/wc/v3/products"
               + "?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
               + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de"
               + "&per_page=100";
    // Chunk into groups of 100 (API limit) and fetch in parallel
    const chunks = [];
    for (let i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
    _productsFetchPromise = Promise.all(chunks.map(chunk =>
      fetch(base + `&include=${chunk.join(',')}`)
        .then(r => r.json())
        .then(products => products.forEach(p => { _productCache[p.id] = p; }))
        .catch(() => {})
    ));
    return _productsFetchPromise;
  }

  // Fetch & build
  Promise.all([fetchAllOrders(), loadPhasesFS(), loadProductsFS()]).then(([orders]) => {
    document.getElementById('state').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    allOrders = orders;
    // Orders with no line_items (custom-amount / fee-only): inject a synthetic item
    allOrders.forEach(order => {
      if (!order.line_items.length) {
        const feeName = (order.fee_lines || []).length
          ? order.fee_lines.map(f => f.name).join(' + ')
          : 'Custom Amount';
        order.line_items = [{
          id: 0, name: feeName, total: order.total,
          quantity: 1, product_id: 0, meta_data: [], image: null, _synthetic: true
        }];
      }
    });
    orders.forEach(order => {
      const days = daysSince(order.date_created);
      order.line_items.forEach((item, idx) => {
        allItems.push({ order, item, idx, days });
      });
    });

    grandTotal = 0; grandQty = 0;
    allOrders.forEach(o => o.line_items.forEach(i => {
      grandTotal += parseFloat(i.total || 0);
      grandQty   += (i.quantity || 1);
    }));
    document.getElementById('itemCount').textContent =
      grandQty + ' items · ' + orders.length + ' orders';
    document.getElementById('totalValue').textContent =
      Math.round(grandTotal).toLocaleString() + ' EGP';

    buildPhaseFilterSel();
    updatePhaseFilterSel();
    render();
    updateProductCountLbl();
  }).catch(e => {
    document.getElementById('state').textContent = 'Error: ' + e.message;
  });

  // ── Kanban board ──────────────────────────────────────────────────
  let kanbanBuilt = false;

  function buildKanban() {
    if (kanbanBuilt) return;
    kanbanBuilt = true;
    const board = document.getElementById('kb-board');
    board.innerHTML = '';
    const colMap = {};

    ALL_PHASES.forEach(phase => {
      const col = document.createElement('div');
      col.className = 'kb-col';
      col.dataset.kbGroup = kbGroup(phase);
      col.innerHTML = `<div class="kb-col-header"><div class="kb-col-title">${phase}</div><div class="kb-col-count" id="kbcnt-${encodeKbPhase(phase)}">0</div></div><div class="kb-col-body" data-phase="${phase}"></div>`;
      board.appendChild(col);
      const body = col.querySelector('.kb-col-body');
      colMap[phase] = body;
      body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
      body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
      body.addEventListener('drop', e => {
        e.preventDefault(); body.classList.remove('drag-over');
        const { orderId, itemId } = JSON.parse(e.dataTransfer.getData('text/plain'));
        const card = board.querySelector(`.kb-card[data-order-id="${orderId}"][data-item-id="${itemId}"]`);
        if (!card) return;
        const oldPhase = card.dataset.phase;
        const newPhase = body.dataset.phase;
        if (oldPhase === newPhase) return;
        setItemPhase(orderId, itemId, newPhase);
        body.appendChild(card);
        card.dataset.phase = newPhase;
        updateKbCount(oldPhase); updateKbCount(newPhase);
      });
    });

    // Collect items per phase
    const phaseItems = {};
    allOrders.forEach(order => {
      order.line_items.forEach((item, idx) => {
        const phase = getItemPhase(order.id, item.id);
        if (!colMap[phase]) return;
        if (!phaseItems[phase]) phaseItems[phase] = [];
        phaseItems[phase].push({ order, item, idx });
      });
    });

    // Sort each phase: group by product name, highest total QTY first, then highest total value
    ALL_PHASES.forEach(phase => {
      const items = phaseItems[phase] || [];
      const productQty = {};
      const productVal = {};
      items.forEach(({ item }) => {
        productQty[item.name] = (productQty[item.name] || 0) + item.quantity;
        productVal[item.name] = (productVal[item.name] || 0) + parseFloat(item.total || 0);
      });
      items.sort((a, b) => {
        const diff = productQty[b.item.name] - productQty[a.item.name];
        if (diff !== 0) return diff;
        const vdiff = productVal[b.item.name] - productVal[a.item.name];
        if (vdiff !== 0) return vdiff;
        return a.item.name.localeCompare(b.item.name);
      });
      const col = colMap[phase];
      items.forEach(({ order, item, idx }) => {
        const days = daysSince(order.date_created);
        const card = document.createElement('div');
        card.className = 'kb-card'; card.draggable = true;
        card.dataset.orderId = order.id; card.dataset.itemId = item.id; card.dataset.phase = phase;
        card.innerHTML = `<div class="kb-card-days ${dc(days)}">${days}d</div><div class="kb-card-id">#${order.id} · ${idx+1}</div><div class="kb-card-name" style="${item._synthetic ? 'color:#aaa;font-style:italic' : ''}">${item.name}</div><div class="kb-card-qty">×${item.quantity}</div>`;
        card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify({ orderId: String(order.id), itemId: String(item.id) })); card.classList.add('dragging'); });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        col.appendChild(card);
      });
    });

    ALL_PHASES.forEach(phase => updateKbCount(phase));
    const spacer = document.createElement('div');
    spacer.id = 'kb-end-spacer';
    board.appendChild(spacer);
  }

  function encodeKbPhase(p) { return p.replace(/[^a-zA-Z0-9]/g, '_'); }
  function updateKbCount(phase) {
    const body = document.querySelector(`.kb-col-body[data-phase="${phase}"]`);
    const cnt  = document.getElementById('kbcnt-' + encodeKbPhase(phase));
    if (body && cnt) cnt.textContent = body.children.length + ' item' + (body.children.length !== 1 ? 's' : '');
  }

  // ── Kanban scroll slider ──────────────────────────────────────────
  const kbSlider     = document.getElementById('kb-slider');
  const kbSliderWrap = document.getElementById('kb-slider-wrap');

  kbSlider.addEventListener('input', () => {
    const wrap = document.getElementById('kanban-wrap');
    const max  = wrap.scrollWidth - wrap.clientWidth;
    wrap.scrollLeft = (kbSlider.value / 100) * max;
  });

  document.getElementById('kanban-wrap').addEventListener('scroll', () => {
    const wrap = document.getElementById('kanban-wrap');
    const max  = wrap.scrollWidth - wrap.clientWidth;
    if (max > 0) kbSlider.value = (wrap.scrollLeft / max) * 100;
  });

  // ── Pinch-to-zoom on kanban board ────────────────────────────────
  let kbScale = 1;
  let kbPinchStart = null;

  document.getElementById('kanban-wrap').addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      kbPinchStart = { dist: Math.hypot(dx, dy), scale: kbScale };
    }
  }, { passive: false });

  document.getElementById('kanban-wrap').addEventListener('touchmove', e => {
    if (e.touches.length === 2 && kbPinchStart) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      kbScale = Math.min(2, Math.max(0.4, kbPinchStart.scale * (dist / kbPinchStart.dist)));
      document.getElementById('kb-board').style.transform = `scale(${kbScale})`;
    }
  }, { passive: false });

  document.getElementById('kanban-wrap').addEventListener('touchend', () => { kbPinchStart = null; });

  // ── Tab switching ─────────────────────────────────────────────────
  const tabFab        = document.getElementById('tabFab');
  const tabKanban     = document.getElementById('tabKanban');
  const tabWipChart   = document.getElementById('tabWipChart');
  const tabNoResponse = document.getElementById('tabNoResponse');
  const fabContent    = document.getElementById('content');
  const fabToolbar    = document.querySelector('.toolbar');
  const fabBar        = document.getElementById('completedBar');
  const kanbanWrap    = document.getElementById('kanban-wrap');
  const wipChartWrap  = document.getElementById('wip-chart-wrap');
  const kbFilterBar   = document.getElementById('kb-filter-bar');
  const nrWrap        = document.getElementById('nr-wrap');

  function setTab(active) {
    [tabFab, tabKanban, tabWipChart, tabNoResponse].forEach(t => t.classList.remove('active'));
    active.classList.add('active');
    fabContent.style.display   = active === tabFab ? 'block' : 'none';
    fabToolbar.style.display   = active === tabFab ? '' : 'none';
    fabBar.style.display       = active === tabFab && fabBar.classList.contains('visible') ? 'flex' : 'none';
    kanbanWrap.style.display   = active === tabKanban ? 'block' : 'none';
    kbSliderWrap.style.display = active === tabKanban ? 'block' : 'none';
    kbFilterBar.classList.toggle('visible', active === tabKanban);
    wipChartWrap.style.display = active === tabWipChart ? 'block' : 'none';
    nrWrap.style.display       = active === tabNoResponse ? 'block' : 'none';
  }

  // ── Kanban phase-group filter buttons ────────────────────────────
  const kbActiveFilters = new Set(['production', 'wh', 'delivery']);

  function applyKbFilter() {
    document.querySelectorAll('.kb-col[data-kb-group]').forEach(col => {
      col.classList.toggle('hidden', !kbActiveFilters.has(col.dataset.kbGroup));
    });
  }

  document.querySelectorAll('.kb-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.kbFilter;
      if (kbActiveFilters.has(f)) {
        if (kbActiveFilters.size === 1) return; // keep at least one active
        kbActiveFilters.delete(f);
        btn.classList.remove('active');
      } else {
        kbActiveFilters.add(f);
        btn.classList.add('active');
      }
      applyKbFilter();
    });
  });

  tabFab.addEventListener('click', () => setTab(tabFab));

  tabKanban.addEventListener('click', () => {
    setTab(tabKanban);
    kbSlider.value = 0;
    buildKanban();
  });

  tabWipChart.addEventListener('click', () => {
    setTab(tabWipChart);
    buildWipChart();
  });

  tabNoResponse.addEventListener('click', () => {
    setTab(tabNoResponse);
    renderNoResponse();
  });

  // ── No Response tab ───────────────────────────────────────────────
  const NR_CL_KEY = 'tg_nr_checklist';
  function nrClLoad() { try { return JSON.parse(localStorage.getItem(NR_CL_KEY) || '{}'); } catch { return {}; } }
  function nrClSave(d) { localStorage.setItem(NR_CL_KEY, JSON.stringify(d)); }

  function renderNoResponse() {
    if (!allOrders || !allOrders.length) {
      nrWrap.innerHTML = '<div style="text-align:center;color:#aaa;padding:60px 20px;font-size:13px;">Loading…</div>';
      return;
    }

    // Collect orders that have at least one WH-No_Response item
    const nrOrders = allOrders.filter(o =>
      o.line_items.some(item => getItemPhase(o.id, item.id) === 'WH-No_Response')
    );

    if (!nrOrders.length) {
      nrWrap.innerHTML = '<div style="text-align:center;color:#aaa;padding:60px 20px;font-size:13px;">No items in No Response</div>';
      return;
    }

    // Sort oldest first
    const sorted = [...nrOrders].sort((a, b) => daysSince(b.date_created) - daysSince(a.date_created));
    const cl = nrClLoad();

    const html = sorted.map(o => {
      const days  = daysSince(o.date_created);
      const name  = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ');
      const addr1 = o.billing.address_1 || '';
      const addr2 = o.billing.address_2 || '';
      const state = EG_STATES[o.billing.state] || o.billing.state || '';
      const phone = o.billing.phone || '';
      const waNum = phone.replace(/\D/g,'').replace(/^0/,'20');
      const hasCreatedNR = o.line_items.some(item => getItemPhase(o.id, item.id) === 'Created');
      const waMsgNR = hasCreatedNR ? encodeURIComponent(`مرحبًا ${name},\n\nتم استلام طلبك رقم #${o.id} من Timbered بنجاح.\nيرجى إرسال لوكشن التوصيل 📍.\n___________________________________\nHello, ${name},\n\nYour Timbered order #${o.id} has been received successfully.\nPlease send delivery location 📍`) : '';
      const waHrefNR = waMsgNR ? `https://wa.me/${waNum}?text=${waMsgNR}` : `https://wa.me/${waNum}`;
      const phoneHtml = phone
        ? `<span class="order-phone-wrap" onclick="event.stopPropagation()">
             <a class="order-phone-lbl" href="${waHrefNR}" target="_blank" title="WhatsApp">
               <svg width="13" height="13" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.125.558 4.122 1.532 5.855L0 24l6.335-1.51A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.006-1.374l-.36-.214-3.726.888.936-3.618-.235-.372A9.818 9.818 0 0112 2.182c5.424 0 9.818 4.394 9.818 9.818 0 5.423-4.394 9.818-9.818 9.818z"/></svg>
             </a>
             <span class="order-phone-num">${phone}</span>
             <a class="order-phone-call" href="tel:${phone}" title="Call">
               <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.02 1.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
             </a>
           </span>`
        : '<span class="order-phone-num">—</span>';

      const itemsHtml = o.line_items.map((item, idx) => itemRowHtml(o, item, idx, days)).join('');
      const oc = cl[String(o.id)] || {};
      const NR_DAYS = [
        { key: 'Sat', label: 'Sat' },
        { key: 'Tue', label: 'Tue' },
        { key: 'Fri', label: 'Fri' },
      ];
      const NR_ACTIONS = [
        { key: 'sentWA',  label: 'WA' },
        { key: 'call1PM', label: 'Call 1 PM' },
        { key: 'call5PM', label: 'at 5 PM' },
        { key: 'call8PM', label: 'at 8 PM' },
      ];
      const checklistHtml = NR_DAYS.map(({ key: dayKey, label: dayLabel }) => {
        const dayData = (oc[dayKey] || {});
        const actionsHtml = NR_ACTIONS.map(({ key: actKey, label: actLabel }) => {
          const checked = dayData[actKey] ? 'checked' : '';
          const done    = dayData[actKey] ? ' done'   : '';
          return `<label class="nr-check-item${done}" onclick="event.stopPropagation()">
            <input type="checkbox" ${checked} data-nr-order="${o.id}" data-nr-day="${dayKey}" data-nr-key="${actKey}">
            <span>${actLabel}</span>
          </label>`;
        }).join('');
        return `<div class="nr-cl-row"><span class="nr-cl-day">${dayLabel}</span>${actionsHtml}</div>`;
      }).join('');

      return `<div class="order-card" data-group-key="nr-${o.id}">
        <div class="order-top" onclick="this.closest('.order-card').classList.toggle('open')">
          <span class="d-badge ${dc(days)}">${days}d</span>
          <span class="item-id" style="cursor:pointer" onclick="event.stopPropagation();showOrderDetail(${o.id})">#${o.id}</span>
          <span class="order-name-lbl">${name}</span>
          <span class="order-total-lbl">${parseInt(o.total).toLocaleString()}</span>
          ${phoneHtml}
          <span class="order-chevron">▼</span>
        </div>
        <div class="order-addr-lbl">
          <span class="a1">${addr1}</span>
          <span class="a2">${addr2}</span>
          <span class="a3">${state}</span>
        </div>
        <div class="order-items">
          <div class="order-items-inner">
            ${itemsHtml}
            <div class="nr-checklist">${checklistHtml}</div>
          </div>
        </div>
      </div>`;
    }).join('');

    // Remember which cards were open
    const wasOpen = [...nrWrap.querySelectorAll('.order-card.open')].map(el => el.dataset.groupKey);
    nrWrap.innerHTML = `<div style="padding:8px;">${html}</div>`;
    nrWrap.querySelectorAll('.order-card').forEach(el => {
      if (wasOpen.includes(el.dataset.groupKey)) el.classList.add('open');
    });

    // Phase selector listeners
    nrWrap.querySelectorAll('.phase-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        setItemPhase(sel.dataset.order, sel.dataset.item, sel.value);
        renderNoResponse();
      });
    });

    // Checklist listeners
    nrWrap.querySelectorAll('input[data-nr-order]').forEach(cb => {
      cb.addEventListener('change', () => {
        const d = nrClLoad();
        if (!d[cb.dataset.nrOrder]) d[cb.dataset.nrOrder] = {};
        if (!d[cb.dataset.nrOrder][cb.dataset.nrDay]) d[cb.dataset.nrOrder][cb.dataset.nrDay] = {};
        d[cb.dataset.nrOrder][cb.dataset.nrDay][cb.dataset.nrKey] = cb.checked;
        nrClSave(d);
        cb.closest('.nr-check-item').classList.toggle('done', cb.checked);
      });
    });
  }

  // ── WIP Chart ────────────────────────────────────────────────────
  const WIP_GREEN = ['WH-Ready', 'DLV-Bosta', 'DLV-Private', 'Delivered Partially', 'Delivered'];
  const WIP_RED   = ['Not Confirmed', 'WH-Defected', 'WH-No_Response', 'WH-Postponed', 'WH-Returned',
                     'Not Received in WH', 'Not available in WH',
                     'DLV-Bareed-Cairo', 'DLV-Bareed-Tanta'];
  Chart.register(ChartDataLabels);
  let wipChartInstance = null;

  function buildWipChart() {
    if (!allOrders || !allOrders.length) return;

    // Aggregate value + item count per phase
    const phaseVal   = {};
    const phaseItems = {};
    allOrders.forEach(order => {
      order.line_items.forEach(item => {
        const phase = getItemPhase(order.id, item.id);
        phaseVal[phase]   = (phaseVal[phase]   || 0) + parseFloat(item.total  || 0);
        phaseItems[phase] = (phaseItems[phase] || 0) + (item.quantity || 1);
      });
    });

    // Sort by ALL_PHASES order, skip phases with 0 value
    const phases = ALL_PHASES.filter(p => (phaseVal[p] || 0) > 0);
    const values = phases.map(p => phaseVal[p]);
    const counts = phases.map(p => phaseItems[p] || 0);
    const colors = phases.map(p =>
      WIP_GREEN.includes(p) ? '#27ae60' :
      WIP_RED.includes(p)   ? '#e74c3c' : '#3498db'
    );

    document.getElementById('wipTotalVal').textContent   = Math.round(grandTotal).toLocaleString() + ' EGP';
    document.getElementById('wipTotalItems').textContent = grandQty + ' items';

    // Group summary table
    const GROUP_DEFS = [
      { label: 'Order Review',      phases: ORDER_REVIEW_PHASES },
      { label: 'Planning',          phases: PLANNING_PHASES },
      { label: 'Production',        phases: FAB_PHASES },
      { label: 'Repair',            phases: REPAIR_PHASES },
      { label: 'Dispatch',          phases: DISPATCH_PHASES },
      { label: 'Prod-WH Interface', phases: PROD_WH_PHASES },
      { label: 'WH',                phases: WH_PHASES },
      { label: 'In Delivery',       phases: DELIVERY_KB_PHASES },
      { label: 'Delivered',         phases: DELIVERED_KB_PHASES },
    ];
    const tableRows = GROUP_DEFS.map(g => {
      const items = g.phases.reduce((s, p) => s + (phaseItems[p] || 0), 0);
      const val   = g.phases.reduce((s, p) => s + (phaseVal[p]   || 0), 0);
      return `<tr>
        <td style="padding:5px 10px;font-weight:600;font-size:12px;color:#7A4610;">${g.label}</td>
        <td style="padding:5px 10px;font-size:12px;text-align:right;">${items}</td>
        <td style="padding:5px 10px;font-size:12px;text-align:right;color:#1a7a3c;font-weight:600;">${Math.round(val).toLocaleString()} EGP</td>
      </tr>`;
    }).join('');
    document.getElementById('wip-group-table').innerHTML = `
      <table style="width:100%;border-collapse:collapse;border:1px solid #e8ddd4;border-radius:8px;overflow:hidden;">
        <thead>
          <tr style="background:#f5f0eb;">
            <th style="padding:6px 10px;font-size:11px;text-align:left;color:#7A4610;">Group</th>
            <th style="padding:6px 10px;font-size:11px;text-align:right;color:#7A4610;">Items</th>
            <th style="padding:6px 10px;font-size:11px;text-align:right;color:#7A4610;">Value</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>`;

    const ctx = document.getElementById('wipChart').getContext('2d');
    if (wipChartInstance) { wipChartInstance.destroy(); wipChartInstance = null; }
    wipChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: phases,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        onClick: (event, elements) => {
          if (!elements.length) return;
          const phase = phases[elements[0].index];
          // Switch to Fabrication tab, phase view, open that group
          setTab(tabFab);
          if (currentView !== 'phase') {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.view-btn[data-view="phase"]').classList.add('active');
            currentView = 'phase';
          }
          render('phase-' + phase);
          setTimeout(() => {
            const group = document.querySelector(`[data-group-key="phase-${phase}"]`);
            if (group) group.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 50);
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => {
                const i = c.dataIndex;
                return [
                  'Value: ' + Math.round(values[i]).toLocaleString() + ' EGP',
                  'Items: ' + counts[i]
                ];
              }
            }
          },
          datalabels: {
            anchor: 'end', align: 'top',
            color: (c) => colors[c.dataIndex],
            font: { weight: 'bold', size: 9 },
            formatter: v => v > 0 ? Math.round(v / 1000) + 'K' : ''
          }
        },
        scales: {
          x: { ticks: { maxRotation: 90, font: { size: 9 } }, grid: { display: false } },
          y: { ticks: { callback: v => v / 1000 + 'K' }, grid: { color: '#f0f0f0' } }
        }
      }
    });
  }
  // Note callout
  const noteCallout = document.getElementById('noteCallout');
  const noteCalloutText = document.getElementById('noteCalloutText');
  let noteCalloutOpen = false;

  function showNoteCallout(el, text) {
    if (noteCalloutOpen && noteCallout._anchor === el) {
      noteCallout.style.display = 'none';
      noteCalloutOpen = false;
      return;
    }
    noteCalloutText.textContent = text;
    noteCallout.style.display = 'block';
    noteCallout._anchor = el;
    noteCalloutOpen = true;
    const r = el.getBoundingClientRect();
    const cw = noteCallout.offsetWidth;
    let left = r.left;
    if (left + cw > window.innerWidth - 8) left = window.innerWidth - cw - 8;
    noteCallout.style.left = left + 'px';
    noteCallout.style.top  = (r.bottom + 6) + 'px';
  }
  document.addEventListener('click', (e) => {
    if (noteCalloutOpen && !noteCallout.contains(e.target)) {
      noteCallout.style.display = 'none';
      noteCalloutOpen = false;
    }
  });
</script>
</body>
</html>
