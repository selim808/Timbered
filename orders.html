<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Timbered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 100; }
    .site-header img { height: 26px; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .site-header .badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
    .site-header .back { font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    .cards { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

    .card { background: #fff; border: 1px solid #e8ddd4; border-radius: 8px; padding: 7px 10px; }
    .card-top { display: flex; align-items: center; gap: 8px; }
    .d-badge { font-size: 10px; font-weight: 700; color: #fff; background: #7A4610; border-radius: 4px; padding: 1px 5px; white-space: nowrap; flex-shrink: 0; }
    .d-badge.warn   { background: #e67e22; }
    .d-badge.urgent { background: #e74c3c; }
    .card-id { font-size: 10px; color: #aaa; white-space: nowrap; flex-shrink: 0; }
    .card-name { font-size: 12px; font-weight: 700; color: #222; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-total { font-size: 12px; font-weight: 700; color: #7A4610; white-space: nowrap; flex-shrink: 0; }
    .card-phone { font-size: 11px; color: #888; white-space: nowrap; flex-shrink: 0; }
    .card-addr { display: flex; gap: 6px; font-size: 11px; color: #999; margin-top: 3px; }
    .card-addr .a1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-addr .a2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
    .card-addr .a3 { flex-shrink: 0; white-space: nowrap; text-align: right; font-weight: 600; color: #7A4610; }
    .card-top { cursor: pointer; }
    .card-chevron { margin-left: auto; font-size: 10px; color: #bbb; flex-shrink: 0; transition: transform 0.2s; }
    .card.open .card-chevron { transform: rotate(180deg); }
    .card-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; margin-top: 0; }
    .card-items-inner { overflow: hidden; }
    .card.open .card-items { grid-template-rows: 1fr; margin-top: 6px; }
    .card.open .card-items-inner { border-top: 1px solid #f0e8e0; padding-top: 6px; }
    .item-row { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; color: #555; }
    .item-no { font-size: 10px; color: #aaa; white-space: nowrap; flex-shrink: 0; }
    .item-qty { font-weight: 700; color: #7A4610; flex-shrink: 0; }
    .item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-price { font-weight: 700; color: #333; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="site-header">
  <img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <span class="title">Processing Orders</span>
  <span class="badge" id="orderCount">Loading…</span>
  <div class="header-actions">
    <a href="index.html" class="back">← Back</a>
  </div>
</div>

<div style="display:flex; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid #e8ddd4; position:sticky; top:50px; z-index:99;">
  <a href="orders-fabrication.html" style="font-size:12px; color:#7A4610; text-decoration:none; border:1px solid #7A4610; border-radius:20px; padding:4px 14px;">Fabrication</a>
  <a href="orders-map.html" style="font-size:12px; color:#7A4610; text-decoration:none; border:1px solid #7A4610; border-radius:20px; padding:4px 14px;">Map</a>
</div>
<div id="state">Fetching orders…</div>
<div class="cards" id="cards" style="display:none;"></div>

<script>
  const WC_BASE = "https://timberedgroup.com/wp-json/wc/v3/orders"
               + "?consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
               + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de"
               + "&status=processing&orderby=date&order=desc&per_page=100";

  async function fetchAllOrders() {
    const first      = await fetch(WC_BASE + '&page=1');
    const totalPages = parseInt(first.headers.get('X-WP-TotalPages') || '1');
    const firstRows  = await first.json();
    const rest = totalPages > 1
        ? await Promise.all(Array.from({ length: totalPages - 1 }, (_, i) =>
            fetch(WC_BASE + '&page=' + (i + 2)).then(r => r.json())))
        : [];
    const all = [firstRows, ...rest].flat();
    return all;
  }

  function daysSince(dateStr) {
    if (!dateStr) return 0;
    return Math.floor((new Date() - new Date(dateStr)) / 86400000);
  }

  const EG_STATES = {
    "0":"Alexandria","1":"Assuit","2":"Aswan","3":"Bani Suif","4":"Behira",
    "5":"Cairo","6":"Dakahlia","7":"Damietta","8":"El Kalioubia","9":"Fayoum",
    "10":"Gharbia","11":"Giza","12":"Ismailia","13":"Kafr Alsheikh","14":"Luxor",
    "15":"Matrouh","16":"Menya","17":"Monufia","18":"New Valley","19":"North Coast",
    "21":"Port Said","22":"Qena","23":"Red Sea","24":"Sharqia","25":"Sohag",
    "26":"South Sinai","27":"Suez"
  };

  function formatAddress(billing) {
    const stateName = EG_STATES[billing.state] || billing.state || '';
    return [billing.address_1, billing.address_2, stateName].filter(Boolean).join(', ');
  }

  fetchAllOrders().then(orders => {
    document.getElementById('state').style.display = 'none';
    document.getElementById('cards').style.display = 'flex';
    document.getElementById('orderCount').textContent = orders.length + ' orders';

    const container = document.getElementById('cards');
    orders.forEach(o => {
      const days = daysSince(o.date_created);
      const dc   = days >= 14 ? 'urgent' : days >= 7 ? 'warn' : '';
      const addr = formatAddress(o.billing);
      const name = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ');

      const card = document.createElement('div');
      card.className = 'card';
      const itemsHtml = o.line_items.map((item, idx) => `
        <div class="item-row">
          <span class="item-no">${o.id}.${idx + 1}</span>
          <span class="item-qty">${item.quantity}×</span>
          <span class="item-name">${item.name}</span>
          <span class="item-price">${parseInt(item.total).toLocaleString()}</span>
        </div>`).join('');

      card.innerHTML = `
        <div class="card-top">
          <span class="d-badge ${dc}">${days}d</span>
          <span class="card-id">#${o.id}</span>
          <span class="card-name">${name}</span>
          <span class="card-total">${parseInt(o.total).toLocaleString()}</span>
          <span class="card-phone">${o.billing.phone || '—'}</span>
          <span class="card-chevron">▼</span>
        </div>
        <div class="card-addr">
          <span class="a1">${o.billing.address_1 || '—'}</span>
          <span class="a2">${o.billing.address_2 || ''}</span>
          <span class="a3">${EG_STATES[o.billing.state] || o.billing.state || ''}</span>
        </div>
        <div class="card-items"><div class="card-items-inner">${itemsHtml}</div></div>`;

      card.querySelector('.card-top').addEventListener('click', () => card.classList.toggle('open'));
      container.appendChild(card);
    });
  }).catch(e => {
    document.getElementById('state').textContent = 'Error: ' + e.message;
  });
</script>
</body>
</html>
