<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Service — Timbered</title>
  <link rel="shortcut icon" type="image/png" href="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    /* HEADER */
    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 100; }
    .site-header img { height: 26px; display: block; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
    .back { margin-left: auto; font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }

    /* SUB-NAV */
    .sub-nav { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e8ddd4; position: sticky; top: 51px; z-index: 100; }
    .sub-nav-btn { font-size: 12px; font-weight: 700; color: #aaa; background: none; border: none; cursor: pointer; padding: 8px 18px; border-bottom: 2px solid transparent; }
    .sub-nav-btn.active { color: #7A4610; border-bottom-color: #7A4610; }
    .sub-nav-btn:hover { color: #7A4610; }

    /* TOOLBAR */
    .toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e8ddd4; position: sticky; top: 83px; z-index: 99; flex-wrap: wrap; }
    .sort-btn { font-size: 14px; background: none; border: 1.5px solid #e8ddd4; border-radius: 8px; padding: 2px 8px; cursor: pointer; color: #7A4610; line-height: 1.4; }

    /* STATE */
    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    /* CONTENT */
    #content { padding: 10px; }

    /* ── ITEM ROW ── */
    .item-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid #f5f0eb; }
    .d-badge { font-size: 10px; font-weight: 700; color: #fff; background: #7A4610; border-radius: 4px; padding: 1px 5px; white-space: nowrap; flex-shrink: 0; }
    .d-badge.warn   { background: #e67e22; }
    .d-badge.urgent { background: #e74c3c; }
    .item-id   { font-size: 10px; color: #aaa; white-space: nowrap; flex-shrink: 0; }
    .item-name { font-size: 12px; font-weight: 600; color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
    .item-name:hover { text-decoration: underline; color: #7A4610; }
    .item-qty  { font-size: 11px; color: #888; flex-shrink: 0; }
    .item-price { font-size: 11px; color: #7A4610; font-weight: 600; flex-shrink: 0; }
    .item-thumb { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; flex-shrink: 0; cursor: pointer; border: 1px solid #e8ddd4; }
    .item-thumb-placeholder { width: 28px; height: 28px; border-radius: 5px; background: #f0e8e0; flex-shrink: 0; }

    /* ── BY ORDER VIEW ── */
    .order-card { background: #fff; border: 1px solid #e8ddd4; border-radius: 8px; margin-bottom: 6px; }
    .order-top { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
    .order-top:hover { background: #fdf8f4; border-radius: 8px 8px 0 0; }
    .order-name-lbl { font-size: 12px; font-weight: 700; color: #222; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order-total-lbl { font-size: 12px; font-weight: 700; color: #7A4610; white-space: nowrap; flex-shrink: 0; }
    .order-phone-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .order-phone-num  { font-size: 11px; color: #555; white-space: nowrap; }
    .order-phone-lbl  { display: flex; align-items: center; text-decoration: none; }
    .order-phone-lbl:hover svg { opacity: 0.75; }
    .order-phone-call { display: flex; align-items: center; text-decoration: none; }
    .order-phone-call:hover svg { opacity: 0.6; }
    .order-chevron { font-size: 10px; color: #bbb; flex-shrink: 0; transition: transform 0.2s; }
    .order-card.open .order-chevron { transform: rotate(180deg); }
    .order-addr-lbl { font-size: 11px; color: #999; padding: 0 10px 6px; display: flex; gap: 6px; }
    .order-addr-lbl .a1 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .order-addr-lbl .a2 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .order-addr-lbl .a3 { flex-shrink:0; white-space:nowrap; font-weight:600; color:#7A4610; }
    .order-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
    .order-items-inner { overflow: hidden; }
    .order-card.open .order-items { grid-template-rows: 1fr; }
    .order-date-lbl { font-size: 10px; color: #27ae60; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .order-days-lbl { font-size: 10px; color: #e67e22; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .phase-sel { font-size: 11px; border: 1px solid #e8ddd4; border-radius: 6px; padding: 2px 4px; color: #555; flex-shrink: 0; max-width: 90px; }

    /* photo popup */
    .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; cursor: pointer; }
    .photo-overlay.open { display: flex; }
    .photo-popup { background: #fff; border-radius: 14px; padding: 14px; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; gap: 10px; cursor: default; }
    .photo-popup img { max-width: min(420px, 85vw); max-height: 70vh; object-fit: contain; border-radius: 8px; display: block; }
    .photo-popup-name { font-size: 13px; font-weight: 700; color: #333; text-align: center; }
    .photo-popup-meta { display: flex; flex-direction: column; gap: 4px; }
    .photo-popup-meta span { font-size: 12px; color: #666; text-align: center; }
    .photo-popup-meta strong { color: #333; }
  </style>
</head>
<body>

<div class="site-header">
  <a href="index.html"><img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered"></a>
  <span class="title">Customer Service</span>
  <span class="badge" id="orderCount">Loading…</span>
  <a href="index.html" class="back">← Back</a>
</div>

<div class="sub-nav">
  <button class="sub-nav-btn active" id="tabCompleted" onclick="switchTab('completed')">Completed</button>
  <button class="sub-nav-btn" id="tabNoResponse" onclick="switchTab('noresponse')">No Response</button>
</div>

<div class="toolbar">
  <button class="sort-btn" id="sortBtn" title="Toggle sort">↓</button>
  <input id="searchInput" type="search" placeholder="Search item, order ID, client or phone…"
    style="width:100%; font-size:12px; padding:5px 10px; border:1.5px solid #e8ddd4; border-radius:8px; outline:none; color:#333; flex-basis:100%;">
</div>

<div id="state">Loading…</div>
<div id="content" style="display:none;"></div>

<!-- Photo popup -->
<div class="photo-overlay" id="photoOverlay" onclick="closePhoto()">
  <div class="photo-popup" onclick="event.stopPropagation()">
    <div class="photo-popup-name" id="photoName"></div>
    <img id="photoImg" src="" alt="">
    <div class="photo-popup-meta" id="photoMeta"></div>
  </div>
</div>

<script>
  const WC_CREDS  = "consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
                  + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de";
  const WC_ORDERS = "https://timberedgroup.com/wp-json/wc/v3/orders?" + WC_CREDS;
  const WC_PUT    = id => `https://timberedgroup.com/wp-json/wc/v3/orders/${id}?${WC_CREDS}`;

  const ALL_PHASES = [
    "Created","WA msg","Call","No Confirmation","Confirmed",
    "Check Inventory","Model & DWG","JO preparation","Procurement","Material Received","JO released",
    "Cutting","CNC","Upholstery","Shaping & Joint prep.","Sand-fillet","Assemble & label",
    "Paint & inspec.",
    "Received from WH","QC-Rejected",
    "R-Assessment","R-Cutting","R-CNC","R-Upholstery","R-Shaping & Joint prep.","R-Sand-fillet",
    "R-Assemble & label","R-Paint & inspec.",
    "Packaging","Ready to Ship",
    "Sent to WH","Not Received in WH","Already in WH",
    "Not available in WH","Sent to Production","WH-Defected","WH-No_Response",
    "WH-Postponed","WH-Returned","WH-Ready","DLV-Bareed-Cairo","DLV-Bareed-Tanta",
    "DLV-Bosta","DLV-Private","Delivered Partially"
  ];

  const EG_STATES = {
    "0":"Alexandria","1":"Assuit","2":"Aswan","3":"Bani Suif","4":"Behira",
    "5":"Cairo","6":"Dakahlia","7":"Damietta","8":"El Kalioubia","9":"Fayoum",
    "10":"Gharbia","11":"Giza","12":"Ismailia","13":"Kafr Alsheikh","14":"Luxor",
    "15":"Matruh","16":"Minia","17":"Minya","18":"Monufia","19":"New Valley",
    "20":"North Sinai","21":"Port Said","22":"Qalyubia","23":"Qena","24":"Red Sea",
    "25":"Sharqia","26":"Sharkia","27":"Sohag","28":"South Sinai","29":"Suez","30":"Tanta"
  };

  // ── Phase helpers (WC API meta_data only) ────────────────────────
  function setItemPhase(orderId, itemId, phase) {
    // Update in-memory so UI stays consistent without reload
    const allOrders = [...(completedOrders || []), ...(noResponseOrders || [])];
    const order = allOrders.find(o => String(o.id) === String(orderId));
    if (order) {
      const item = order.line_items.find(i => String(i.id) === String(itemId));
      if (item) {
        const existing = (item.meta_data || []).find(m => m.key === 'tg_phase');
        if (existing) existing.value = phase;
        else { if (!item.meta_data) item.meta_data = []; item.meta_data.push({ key: 'tg_phase', value: phase }); }
      }
    }
    fetch(WC_PUT(orderId), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line_items: [{ id: parseInt(itemId), meta_data: [{ key: 'tg_phase', value: phase }] }] })
    }).catch(() => {});
  }

  function phaseSelHtml(current, orderId, itemId) {
    return `<select class="phase-sel" data-order="${orderId}" data-item="${itemId}" onclick="event.stopPropagation()">
      ${ALL_PHASES.map(p => `<option value="${p}"${p===current?' selected':''}>${p}</option>`).join('')}
    </select>`;
  }

  async function fetchOrders(status, extra = '') {
    let page = 1, all = [];
    while (true) {
      const res = await fetch(`${WC_ORDERS}&status=${status}&orderby=modified&order=desc&per_page=100${extra}&page=${page}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const batch = await res.json();
      if (!batch.length) break;
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
    return all;
  }

  // Photo popup
  const _photoItems = {};
  let _productCache = {};
  let _productsFetchPromise = null;

  function openPhoto(itemId) {
    const item = _photoItems[itemId];
    if (!item) return;
    document.getElementById('photoName').textContent = item.name;
    document.getElementById('photoImg').src = item.image && item.image.src ? item.image.src : '';
    document.getElementById('photoMeta').innerHTML = '';
    document.getElementById('photoOverlay').classList.add('open');
    ensureProductsCached().then(() => {
      const p = _productCache[item.product_id];
      if (!p) return;
      const d = p.dimensions || {};
      const dimParts = [d.length?`L: ${d.length}`:'', d.width?`W: ${d.width}`:'', d.height?`H: ${d.height}`:''].filter(Boolean);
      const dimensions = dimParts.length ? dimParts.join(' · ') : null;
      const material = (p.attributes || []).find(a =>
        a.name.toLowerCase().includes('material') || a.name.toLowerCase().includes('خامة') || a.name.toLowerCase().includes('wood')
      )?.options?.join(', ') || null;
      document.getElementById('photoMeta').innerHTML = [
        dimensions ? `<span><strong>Dimensions:</strong> ${dimensions}</span>` : '',
        material   ? `<span><strong>Material:</strong> ${material}</span>`     : '',
      ].filter(Boolean).join('') || '';
    }).catch(() => {});
  }
  function closePhoto() { document.getElementById('photoOverlay').classList.remove('open'); }

  function ensureProductsCached() {
    if (_productsFetchPromise) return _productsFetchPromise;
    const allO = [...completedOrders, ...noResponseOrders];
    const ids = [...new Set(allO.flatMap(o => o.line_items.map(i => i.product_id)).filter(Boolean))];
    if (!ids.length) return (_productsFetchPromise = Promise.resolve());
    const base = "https://timberedgroup.com/wp-json/wc/v3/products?" + WC_CREDS + "&per_page=100";
    const chunks = [];
    for (let i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
    _productsFetchPromise = Promise.all(chunks.map(chunk =>
      fetch(base + `&include=${chunk.join(',')}`)
        .then(r => r.json())
        .then(products => products.forEach(p => { _productCache[p.id] = p; }))
        .catch(() => {})
    ));
    return _productsFetchPromise;
  }

  function daysSince(dateStr) {
    return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  }
  function dc(days) { return days >= 14 ? 'urgent' : days >= 7 ? 'warn' : ''; }

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' });
  }

  // Item row HTML
  function itemRowHtml(order, item, idx, showPhase = false) {
    const imgSrc  = item.image && item.image.src ? item.image.src : '';
    const prodUrl = `https://timberedgroup.com/?p=${item.product_id}`;
    _photoItems[item.id] = item;
    const thumb = imgSrc
      ? `<img class="item-thumb" src="${imgSrc}" alt="" onclick="openPhoto(${item.id})">`
      : `<span class="item-thumb-placeholder"></span>`;
    const phaseMeta = (item.meta_data || []).find(m => m.key === 'tg_phase');
    const phase = phaseMeta?.value || 'Created';
    const phaseTag = showPhase ? phaseSelHtml(phase, order.id, item.id) : '';
    return `<div class="item-row">
      ${thumb}
      <span class="item-id">${order.id}.${idx+1}</span>
      <a class="item-name" href="${prodUrl}" target="_blank" onclick="event.stopPropagation()">${item.name}</a>
      <span class="item-qty">×${item.quantity}</span>
      <span class="item-price">${Math.round(parseFloat(item.total||0)).toLocaleString()}</span>
      ${phaseTag}
    </div>`;
  }

  function phoneHtml(phone) {
    if (!phone) return '<span class="order-phone-num">—</span>';
    const wa = phone.replace(/\D/g,'').replace(/^0/,'20');
    return `<span class="order-phone-wrap" onclick="event.stopPropagation()">
      <a class="order-phone-lbl" href="https://wa.me/${wa}" target="_blank" title="WhatsApp">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.125.558 4.122 1.532 5.855L0 24l6.335-1.51A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.006-1.374l-.36-.214-3.726.888.936-3.618-.235-.372A9.818 9.818 0 0112 2.182c5.424 0 9.818 4.394 9.818 9.818 0 5.423-4.394 9.818-9.818 9.818z"/></svg>
      </a>
      <span class="order-phone-num">${phone}</span>
      <a class="order-phone-call" href="tel:${phone}" title="Call">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.02 1.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      </a>
    </span>`;
  }

  // Render completed orders
  function renderCompleted(orders_list) {
    if (!orders_list.length) return '<div style="text-align:center;color:#aaa;padding:40px;font-size:13px;">No completed orders</div>';
    return orders_list.map(o => {
      const name  = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ');
      const addr1 = o.billing.address_1 || '';
      const addr2 = o.billing.address_2 || '';
      const state = EG_STATES[o.billing.state] || o.billing.state || '';
      const completedDate = fmtDate(o.date_modified || o.date_completed);
      const itemsHtml = o.line_items.map((item, idx) => itemRowHtml(o, item, idx)).join('');
      return `<div class="order-card" data-group-key="order-${o.id}">
        <div class="order-top" onclick="this.closest('.order-card').classList.toggle('open')">
          <span class="item-id">#${o.id}</span>
          <span class="order-name-lbl">${name}</span>
          <span class="order-total-lbl">${parseInt(o.total).toLocaleString()}</span>
          ${phoneHtml(o.billing.phone)}
          <span class="order-date-lbl">${completedDate}</span>
          <span class="order-chevron">▼</span>
        </div>
        <div class="order-addr-lbl">
          <span class="a1">${addr1}</span>
          <span class="a2">${addr2}</span>
          <span class="a3">${state}</span>
        </div>
        <div class="order-items"><div class="order-items-inner">${itemsHtml}</div></div>
      </div>`;
    }).join('');
  }

  // Render no-response orders (processing orders with WH-No_Response items)
  function renderNoResponse(orders_list) {
    if (!orders_list.length) return '<div style="text-align:center;color:#aaa;padding:40px;font-size:13px;">No orders in No Response</div>';
    return orders_list.map(o => {
      const name  = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ');
      const addr1 = o.billing.address_1 || '';
      const addr2 = o.billing.address_2 || '';
      const state = EG_STATES[o.billing.state] || o.billing.state || '';
      const days  = daysSince(o.date_created);
      const nrItems = o.line_items.filter((item) => {
        const meta = (item.meta_data || []).find(m => m.key === 'tg_phase');
        return (meta?.value || 'Created') === 'WH-No_Response';
      });
      const itemsHtml = nrItems.map((item, idx) => itemRowHtml(o, item, idx, true)).join('');
      return `<div class="order-card" data-group-key="order-${o.id}">
        <div class="order-top" onclick="this.closest('.order-card').classList.toggle('open')">
          <span class="item-id">#${o.id}</span>
          <span class="order-name-lbl">${name}</span>
          <span class="order-total-lbl">${parseInt(o.total).toLocaleString()}</span>
          ${phoneHtml(o.billing.phone)}
          <span class="order-days-lbl ${dc(days)}">${days}d</span>
          <span class="order-chevron">▼</span>
        </div>
        <div class="order-addr-lbl">
          <span class="a1">${addr1}</span>
          <span class="a2">${addr2}</span>
          <span class="a3">${state}</span>
        </div>
        <div class="order-items"><div class="order-items-inner">${itemsHtml}</div></div>
      </div>`;
    }).join('');
  }

  // ── State ─────────────────────────────────────────────────────────
  let activeTab = 'completed';
  let sortAsc = false;
  let completedOrders = [];
  let noResponseOrders = [];

  function currentOrders() {
    return activeTab === 'completed' ? completedOrders : noResponseOrders;
  }

  function searchQuery() {
    return (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  }
  function orderMatches(o, q) {
    const name = [o.billing.first_name, o.billing.last_name].join(' ').toLowerCase();
    const phone = (o.billing.phone || '').toLowerCase();
    return String(o.id).includes(q) || phone.includes(q) || name.includes(q);
  }
  function filteredOrders() {
    const q = searchQuery();
    const orders = currentOrders();
    if (!q) return orders;
    return orders.filter(o =>
      orderMatches(o, q) || o.line_items.some(item => item.name.toLowerCase().includes(q)));
  }

  function getOpenGroups() {
    return [...document.querySelectorAll('[data-group-key].open')].map(el => el.dataset.groupKey);
  }
  function restoreOpenGroups(keys) {
    if (!keys.length) return;
    document.querySelectorAll('[data-group-key]').forEach(el => {
      if (keys.includes(el.dataset.groupKey)) el.classList.add('open');
    });
  }

  function render() {
    const content = document.getElementById('content');
    const wasOpen = getOpenGroups();
    const orders  = filteredOrders();

    if (activeTab === 'completed') {
      const sorted = [...orders].sort((a, b) => {
        const ta = new Date(a.date_modified || a.date_created).getTime();
        const tb = new Date(b.date_modified || b.date_created).getTime();
        return sortAsc ? ta - tb : tb - ta;
      });
      content.innerHTML = renderCompleted(sorted);
    } else {
      const sorted = [...orders].sort((a, b) => {
        const da = daysSince(a.date_created), db = daysSince(b.date_created);
        return sortAsc ? da - db : db - da;
      });
      content.innerHTML = renderNoResponse(sorted);
    }
    restoreOpenGroups(wasOpen);
    attachPhaseListeners();
  }

  function attachPhaseListeners() {
    document.querySelectorAll('.phase-sel').forEach(sel => {
      sel.addEventListener('change', () => {
        setItemPhase(sel.dataset.order, sel.dataset.item, sel.value);
        render();
      });
    });
  }

  function updateBadge() {
    const orders = currentOrders();
    const totalItems = orders.reduce((s, o) => s + o.line_items.length, 0);
    document.getElementById('orderCount').textContent =
      orders.length + ' orders · ' + totalItems + ' items';
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
    document.getElementById('tabNoResponse').classList.toggle('active', tab === 'noresponse');
    sortAsc = false;
    document.getElementById('sortBtn').textContent = '↓';
    document.getElementById('searchInput').value = '';
    updateBadge();
    render();
  }

  document.getElementById('searchInput').addEventListener('input', () => render());

  document.getElementById('sortBtn').addEventListener('click', () => {
    sortAsc = !sortAsc;
    document.getElementById('sortBtn').textContent = sortAsc ? '↑' : '↓';
    render();
  });

  // Load both tabs in parallel
  document.getElementById('state').textContent = 'Loading…';

  Promise.all([
    fetchOrders('completed'),
    fetchOrders('processing')
  ]).then(([completed, processing]) => {
    completedOrders = completed;

    // Filter processing orders to only those with at least one WH-No_Response item
    noResponseOrders = processing.filter(o =>
      o.line_items.some(item => {
        const meta = (item.meta_data || []).find(m => m.key === 'tg_phase');
        return (meta?.value || 'Created') === 'WH-No_Response';
      })
    );

    document.getElementById('state').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    updateBadge();
    render();
  }).catch(e => {
    document.getElementById('state').textContent = 'Error: ' + e.message;
  });
</script>
</body>
</html>
