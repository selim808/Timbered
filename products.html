<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Timbered</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    .top-fixed { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid #e8ddd4; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .site-header { padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e8ddd4; }
    .site-header img { height: 26px; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; }
    .count-badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 8px; font-weight: 600; }
    .header-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .back-btn { font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; }

    .toolbar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 160px; font-size: 12px; padding: 6px 10px; border: 1.5px solid #e8ddd4; border-radius: 8px; outline: none; color: #333; background: #fafaf8; }
    .filter-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .fb { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1.5px solid #e8ddd4; background: #fff; color: #888; cursor: pointer; white-space: nowrap; }
    .fb.active { background: #7A4610; color: #fff; border-color: #7A4610; }

    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    .grid { padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 7px; }

    .prod-row { background: #fff; border-radius: 12px; border: 1px solid #e8ddd4; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; transition: background 0.1s; }
    .prod-row:hover { background: #fdf8f4; }
    .prod-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid #e8ddd4; flex-shrink: 0; display: block; }
    .prod-thumb-empty { width: 52px; height: 52px; border-radius: 8px; background: #f0e8e0; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; color: #ccc; }
    .prod-info { flex: 1; min-width: 0; }
    .prod-name { font-size: 12px; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prod-meta { font-size: 10px; color: #999; margin-top: 1px; }
    .prod-badges { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
    .pb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 7px; }
    .pb-prod { background: #fef3e2; color: #7A4610; }
    .pb-pipe { background: #e8f4fd; color: #1a6896; }
    .pb-dwg  { background: #f0f9f0; color: #2e7d32; }
    .pb-none { background: #f5f0eb; color: #ccc; }
    .prod-price { font-size: 12px; font-weight: 700; color: #7A4610; white-space: nowrap; flex-shrink: 0; text-align: right; }

    #detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: flex-end; justify-content: center; }
    #detail-overlay.open { display: flex; }
    #detail-box { background: #fff; border-radius: 18px 18px 0 0; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -4px 32px rgba(0,0,0,0.18); }
    .detail-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border-radius: 18px 18px 0 0; }
    .detail-img-empty { width: 100%; aspect-ratio: 4/3; background: #f0e8e0; display: flex; align-items: center; justify-content: center; font-size: 64px; color: #ccc; border-radius: 18px 18px 0 0; }
    .detail-body { padding: 16px; }
    .detail-id { font-size: 11px; color: #bbb; margin-bottom: 2px; }
    .detail-name { font-size: 17px; font-weight: 700; color: #1C1A17; margin-bottom: 8px; line-height: 1.3; }
    .detail-links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .detail-link { font-size: 11px; font-weight: 700; text-decoration: none; padding: 5px 12px; border-radius: 8px; border: 1.5px solid; }
    .dl-wc  { color: #7A4610; border-color: #7A4610; }
    .dl-dwg { color: #2e7d32; border-color: #2e7d32; }
    .detail-stats { display: flex; gap: 8px; margin-bottom: 16px; }
    .dstat { flex: 1; background: #fef3e2; border-radius: 10px; padding: 10px 8px; text-align: center; }
    .dstat-val { font-size: 19px; font-weight: 800; color: #7A4610; line-height: 1; word-break: break-all; }
    .dstat-lbl { font-size: 9px; color: #a07040; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
    .detail-section-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 7px; }
    .card-row { background: #fef3e2; border-radius: 8px; padding: 8px 12px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cr-left .cr-jo { font-size: 12px; font-weight: 700; color: #7A4610; }
    .cr-left .cr-phase { font-size: 11px; color: #a07040; margin-top: 1px; }
    .cr-qty { font-size: 15px; font-weight: 800; color: #7A4610; white-space: nowrap; }
    .detail-empty { font-size: 12px; color: #ccc; text-align: center; padding: 16px 0 8px; }
    #detail-close { width: 100%; padding: 14px; background: #7A4610; color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 0 0 18px 18px; margin-top: 4px; }
    #detail-close:active { background: #5c3208; }
  </style>
</head>
<body>

<div class="top-fixed">
  <div class="site-header">
    <a href="index.html"><img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered"></a>
    <span class="title">Products</span>
    <span class="count-badge" id="count-badge">Loading…</span>
    <div class="header-right">
      <a href="index.html" class="back-btn">← Back</a>
    </div>
  </div>
  <div class="toolbar">
    <input type="search" id="searchInput" class="search-input" placeholder="Search by name or ID…">
    <div class="filter-btns">
      <button class="fb active" data-f="all">All</button>
      <button class="fb" data-f="in-prod">In Production</button>
      <button class="fb" data-f="in-pipe">In Pipeline</button>
      <button class="fb" data-f="with-dwg">With DWG</button>
    </div>
  </div>
</div>

<div id="state">Loading products…</div>
<div id="grid" class="grid" style="display:none;"></div>

<div id="detail-overlay">
  <div id="detail-box">
    <div id="detail-img-wrap"></div>
    <div class="detail-body">
      <div id="detail-id" class="detail-id"></div>
      <div id="detail-name" class="detail-name"></div>
      <div id="detail-links" class="detail-links"></div>
      <div id="detail-stats" class="detail-stats"></div>
      <div>
        <div class="detail-section-title">Active Production (Firebase)</div>
        <div id="detail-prod-cards"></div>
      </div>
    </div>
    <button id="detail-close" onclick="closeDetail()">Close</button>
  </div>
</div>

<script>
  const FS_KEY  = 'AIzaSyBXREsAkKX25cK5t5EiCrPpGv4zSaBMOgg';
  const FS_BASE = 'https://firestore.googleapis.com/v1/projects/timbered-dashboard/databases/(default)/documents';
  const WC_KEY    = 'ck_dbdad7d7e7e2993164087fd562caf37f14dca362';
  const WC_SECRET = 'cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de';
  const WC_CREDS  = `consumer_key=${WC_KEY}&consumer_secret=${WC_SECRET}`;

  function fromFsVal(v) {
    if (!v) return null;
    if ('nullValue'    in v) return null;
    if ('booleanValue' in v) return v.booleanValue;
    if ('integerValue' in v) return parseInt(v.integerValue);
    if ('doubleValue'  in v) return v.doubleValue;
    if ('stringValue'  in v) return v.stringValue;
    if ('timestampValue' in v) return new Date(v.timestampValue);
    if ('arrayValue'   in v) return (v.arrayValue.values || []).map(fromFsVal);
    if ('mapValue'     in v) {
      const o = {};
      Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => o[k] = fromFsVal(x));
      return o;
    }
    return null;
  }
  function fromFsDoc(doc) {
    const o = {};
    Object.entries(doc.fields || {}).forEach(([k, v]) => o[k] = fromFsVal(v));
    o._id = doc.name.split('/').pop();
    return o;
  }
  async function fsQueryAll(col) {
    const res = await fetch(`${FS_BASE}:runQuery?key=${FS_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId: col }] } })
    });
    const rows = await res.json();
    return rows.filter(r => r.document).map(r => fromFsDoc(r.document));
  }

  async function fetchAllWCProducts() {
    const url = p => `https://timberedgroup.com/wp-json/wc/v3/products?${WC_CREDS}&per_page=100&orderby=title&order=asc&page=${p}`;
    const first = await fetch(url(1));
    const totalPages = parseInt(first.headers.get('X-WP-TotalPages') || '1');
    const firstData = await first.json();
    const rest = totalPages > 1
      ? await Promise.all(Array.from({ length: totalPages - 1 }, (_, i) => fetch(url(i + 2)).then(r => r.json())))
      : [];
    return [firstData, ...rest].flat();
  }

  function getDrawingUrl(p) {
    const meta = (p.meta_data || []).find(m => m.key === 'tg_drawing_url');
    return meta && meta.value ? meta.value : null;
  }

  function fmtPrice(p) {
    const v = parseFloat(p.price);
    if (!v) return '';
    return 'EGP ' + v.toLocaleString();
  }

  let allProducts = [];
  let prodByPid   = {};
  let pipeByPid   = {};
  let activeFilter = 'all';

  async function init() {
    try {
      const [products, cards, phases] = await Promise.all([
        fetchAllWCProducts(),
        fsQueryAll('production_cards').catch(() => []),
        fsQueryAll('order_phases').catch(() => [])
      ]);

      allProducts = products;

      cards.filter(c => !c.shipped).forEach(card => {
        (card.items || []).forEach(item => {
          const pid = item.product_id;
          if (!pid) return;
          if (!prodByPid[pid]) prodByPid[pid] = { total_qty: 0, cards: [] };
          const qty = item.total_qty || 0;
          prodByPid[pid].total_qty += qty;
          prodByPid[pid].cards.push({ jo_ref: card.jo_ref || '—', phase: card.phase || '—', qty });
        });
      });

      phases.forEach(doc => {
        const pid = doc.product_id;
        if (!pid) return;
        if (!pipeByPid[pid]) pipeByPid[pid] = { count: 0 };
        pipeByPid[pid].count++;
      });

      document.getElementById('state').style.display = 'none';
      document.getElementById('grid').style.display = 'flex';
      render();
    } catch (e) {
      document.getElementById('state').textContent = 'Failed to load: ' + e.message;
    }
  }

  function render() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allProducts.filter(p => {
      if (q && !p.name.toLowerCase().includes(q) && !String(p.id).includes(q)) return false;
      if (activeFilter === 'in-prod'  && !(prodByPid[p.id]?.total_qty > 0))  return false;
      if (activeFilter === 'in-pipe'  && !(pipeByPid[p.id]?.count > 0))      return false;
      if (activeFilter === 'with-dwg' && !getDrawingUrl(p))                   return false;
      return true;
    });

    document.getElementById('count-badge').textContent = filtered.length + ' products';

    document.getElementById('grid').innerHTML = filtered.map(p => {
      const img = p.images && p.images[0]
        ? `<img class="prod-thumb" src="${p.images[0].src}" alt="">`
        : `<div class="prod-thumb-empty">📦</div>`;
      const inProd = prodByPid[p.id]?.total_qty || 0;
      const inPipe = pipeByPid[p.id]?.count || 0;
      const dwgUrl = getDrawingUrl(p);
      const price  = fmtPrice(p);

      const badges = [];
      if (inProd > 0) badges.push(`<span class="pb pb-prod">${inProd} in production</span>`);
      if (inPipe > 0) badges.push(`<span class="pb pb-pipe">${inPipe} in pipeline</span>`);
      if (dwgUrl)     badges.push(`<span class="pb pb-dwg">DWG</span>`);
      if (!badges.length) badges.push(`<span class="pb pb-none">No active orders</span>`);

      return `<div class="prod-row" onclick="openDetail(${p.id})">
        ${img}
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-meta">#${p.id}${price ? ' · ' + price : ''}</div>
          <div class="prod-badges">${badges.join('')}</div>
        </div>
      </div>`;
    }).join('');
  }

  function openDetail(productId) {
    const p = allProducts.find(x => x.id === productId);
    if (!p) return;

    const dwgUrl = getDrawingUrl(p);
    const inProd = prodByPid[p.id];
    const inPipe = pipeByPid[p.id];

    const imgWrap = document.getElementById('detail-img-wrap');
    if (p.images && p.images[0]) {
      imgWrap.innerHTML = `<img class="detail-img" src="${p.images[0].src}" alt="">`;
    } else {
      imgWrap.innerHTML = `<div class="detail-img-empty">📦</div>`;
    }

    document.getElementById('detail-id').textContent = `#${p.id}`;
    document.getElementById('detail-name').textContent = p.name;

    const links = [];
    if (p.permalink) links.push(`<a class="detail-link dl-wc" href="${p.permalink}" target="_blank">View on site ↗</a>`);
    if (dwgUrl)      links.push(`<a class="detail-link dl-dwg" href="${dwgUrl}" target="_blank">Drawing ↗</a>`);
    document.getElementById('detail-links').innerHTML = links.join('');

    const priceVal = parseFloat(p.price) ? parseFloat(p.price).toLocaleString() : '—';
    document.getElementById('detail-stats').innerHTML = `
      <div class="dstat"><div class="dstat-val">${inProd?.total_qty || 0}</div><div class="dstat-lbl">In Production</div></div>
      <div class="dstat"><div class="dstat-val">${inPipe?.count || 0}</div><div class="dstat-lbl">In Pipeline</div></div>
      <div class="dstat"><div class="dstat-val">${priceVal}</div><div class="dstat-lbl">Price EGP</div></div>`;

    const cards = inProd?.cards || [];
    document.getElementById('detail-prod-cards').innerHTML = cards.length
      ? cards.map(c => `<div class="card-row">
          <div class="cr-left">
            <div class="cr-jo">${c.jo_ref}</div>
            <div class="cr-phase">${c.phase}</div>
          </div>
          <div class="cr-qty">${c.qty} units</div>
        </div>`).join('')
      : `<div class="detail-empty">No active production cards</div>`;

    const overlay = document.getElementById('detail-overlay');
    overlay.classList.add('open');
    overlay.onclick = e => { if (e.target === overlay) closeDetail(); };
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.querySelectorAll('.fb').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.f;
      render();
    });
  });

  init();
</script>

</body>
</html>
