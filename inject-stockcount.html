  const log = document.getElementById('log');
  function print(msg) { log.innerHTML += msg + '<br>'; log.scrollTop = log.scrollHeight; }

  async function run() {
    log.innerHTML = '';
    const now = new Date().toISOString();

    print(`Writing ${data.length} records…`);
    let ok = 0, fail = 0;
    for (const r of data) {
      try {
        const res = await fetch(`${FS_BASE}/stockcount/${r.id}?key=${FS_KEY}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: {
            product_id: { integerValue: String(r.id) },
            stock:      { integerValue: String(r.stock) },
            defected:   { integerValue: String(r.defected) },
            updated_at: { stringValue: now },
          }})
        });
        if (res.ok) { ok++; print(`✅ ${r.id}`); }
        else { fail++; const j = await res.json(); print(`❌ ${r.id} — ${j.error?.message}`); }
      } catch (e) {
        fail++;
        print(`❌ ${r.id} — ${e.message}`);
      }
    }
    print(`<br><b>Done: ${ok} written, ${fail} failed.</b>`);
  }
</script>
