  function log(msg, cls = '') {
    const el = document.getElementById('log');
    el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    el.scrollTop = el.scrollHeight;
  }

  async function run() {
    const btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('log').innerHTML = '';
    log(`Starting migration — ${PRODUCTS.length} products…`, 'info');

    const now = new Date().toISOString();
    let ok = 0, fail = 0;

    for (const p of PRODUCTS) {
      try {
        const res = await fetch(`${FS_BASE}/stockcount/${p.id}?key=${FS_KEY}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: {
            product_id: { integerValue: String(p.id) },
            name:       { stringValue: p.name },
            stock:      { integerValue: String(p.stock) },
            defected:   { integerValue: String(p.defected) },
            updated_at: { stringValue: now },
          }})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || res.status);
        log(`✓ ${p.id}  ${p.name}  (stock: ${p.stock}, defected: ${p.defected})`, 'ok');
        ok++;
      } catch (e) {
        log(`✗ ${p.id}  ${p.name}  — ${e.message}`, 'err');
        fail++;
      }
    }

    log(`\nDone — ${ok} written, ${fail} failed.`, 'info');
    btn.disabled = false;
  }
