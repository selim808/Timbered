<script>
  // ── Firestore REST API (no SDK — avoids GitHub Pages CORS issue) ──

  function toFsVal(v) {
    if (v === null || v === undefined) return { nullValue: null };
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    if (typeof v === 'string') return { stringValue: v };
    if (v instanceof Date) return { timestampValue: v.toISOString() };
    if (Array.isArray(v)) return { arrayValue: { values: v.map(toFsVal) } };
    if (typeof v === 'object') { const f={}; Object.entries(v).forEach(([k,x])=>f[k]=toFsVal(x)); return { mapValue:{fields:f} }; }
    return { stringValue: String(v) };
  }
  function fromFsVal(v) {
    if (!v) return null;
    if ('nullValue' in v) return null;
    if ('booleanValue' in v) return v.booleanValue;
    if ('integerValue' in v) return parseInt(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('stringValue' in v) return v.stringValue;
    if ('timestampValue' in v) return new Date(v.timestampValue);
    if ('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFsVal);
    if ('mapValue' in v) { const o={}; Object.entries(v.mapValue.fields||{}).forEach(([k,x])=>o[k]=fromFsVal(x)); return o; }
    return null;
  }
  function fromFsDoc(doc) {
    const o={}; Object.entries(doc.fields||{}).forEach(([k,v])=>o[k]=fromFsVal(v));
    o._id = doc.name.split('/').pop(); return o;
  }

  let _stockcountFS = {}; // product_id -> { stock, defected }

  const SC_CACHE_KEY = 'tg_stockcount_cache';
  const SC_CACHE_TTL = 5 * 60 * 1000;

  async function loadStockcountFS() {
    try {
      const cached = sessionStorage.getItem(SC_CACHE_KEY);
      if (cached) {
        const { ts, data } = JSON.parse(cached);
        if (Date.now() - ts < SC_CACHE_TTL) { _stockcountFS = data; return; }
      }
      const rows = await fsGetAll('stockcount');
      _stockcountFS = {};
      rows.forEach(doc => {
        const id = parseInt(doc.product_id || doc._id);
        if (!id) return;
        _stockcountFS[id] = {
          stock: parseInt(doc.stock || 0),
          defected: parseInt(doc.defected || 0),
        };
      });
      try { sessionStorage.setItem(SC_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: _stockcountFS })); } catch (_) {}
    } catch (_) {
      _stockcountFS = {};
    }
  }

  function buildOrderedQtyMap(orders) {
    _orderedQtyMap = {};
    orders.forEach(order => (order.line_items || []).forEach(item => {
      if (!item.product_id) return;
      _orderedQtyMap[item.product_id] = (_orderedQtyMap[item.product_id] || 0) + (item.quantity || 0);
    }));
  }

      order.line_items.filter(i => getPhase(order.id, i) === JO_PHASE).forEach(item => {

          map[item.product_id] = {
            product_id: item.product_id,
            name: item.name,
            image: item.image?.src || '',
            mto_qty: 0,
            mto_orders: []
          };
        }
        map[item.product_id].mto_qty += item.quantity;
        const existing = map[item.product_id].mto_orders.find(o => o.order_id === order.id);
        if (existing) { existing.qty += item.quantity; existing._lineItemIds.push(item.id); }
        else map[item.product_id].mto_orders.push({ order_id: order.id, customer, qty: item.quantity, _lineItemIds: [item.id] });
      });
    });
    return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  }

    btn.textContent = 'Submitting…';

    const items = [];
    document.querySelectorAll('.prod-card').forEach(card => {
      const pid = parseInt(card.dataset.pid);
      const input = card.querySelector('.mts-input');
      const mtoQty = parseInt(input.dataset.mto) || 0;
      const mtsQty = parseInt(input.value) || 0;
      const mtoOrders = [];
      card.querySelectorAll('.mto-order-row').forEach(row => {
        const id = parseInt(row.querySelector('.mto-order-id').textContent.replace('#',''));
        const customer = row.querySelector('.mto-order-name').textContent;
        const qty = parseInt(row.querySelector('.mto-order-qty').textContent.replace('×',''));
        mtoOrders.push({ order_id: id, customer, qty });
      });
      items.push({
        product_id: pid,
        product_name: card.querySelector('.prod-name').textContent,
        image: card.querySelector('.prod-thumb')?.src || '',
        dwg_url: card.dataset.dwg || '',
        stock_qty: productStockQty(pid),
        total_ordered_qty: productOrderedQty(pid),
        mto: { qty: mtoQty, orders: mtoOrders },
        mts: { qty: mtsQty },
        total_qty: mtoQty + mtsQty
      });
    });

    // Add pure MTS-only products
    _mtsOnly.forEach(p => {
      items.push({
        product_id: p.product_id,
        product_name: p.name,
        image: p.image || '',
        stock_qty: productStockQty(p.product_id),
        total_ordered_qty: productOrderedQty(p.product_id),
        mto: { qty: 0, orders: [] },
        mts: { qty: parseInt(p.qty) || 1 },
        total_qty: parseInt(p.qty) || 1
      });
    });

    if (!items.length) { btn.disabled = false; btn.textContent = 'Submit Job Order'; return; }

    const allDocs = await fsGetAll('job_orders');
    const nextNum = String(allDocs.length + 1).padStart(3, '0');
    const ref = `JO_${nextNum}`;

    try {
      await fsAdd('job_orders', {
        ref,
        created_at: new Date().toISOString(),
        status: 'open',
        items
      });

      // Advance line items out of JO_PHASE — update Firestore (source of truth) + WC meta
      const wcUpdates = {};
      const fsUpdates = [];
      items.forEach(item => {
        const wcProd = _wcProducts.find(p => p.product_id === item.product_id);
        (wcProd?.mto_orders || []).forEach(o => {
          if (!wcUpdates[o.order_id]) wcUpdates[o.order_id] = [];
          wcUpdates[o.order_id].push(...(o._lineItemIds || []));
          (o._lineItemIds || []).forEach(lid => fsUpdates.push([o.order_id, lid]));
        });
      });

      // Firestore phase update
      fsUpdates.forEach(([orderId, lid]) => fsSetPhase(orderId, lid, 'JO released'));


      btn.textContent = '✓ Submitted!';
      btn.style.background = '#27ae60';
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Submit Job Order';
        btn.style.background = '';
        setTab('tabHistory');
      }, 1500);
    } catch (e) {
      alert('Error saving JO: ' + e.message);
      btn.disabled = false;
      btn.textContent = 'Submit Job Order';
    }
  }

  // ── Edit JO ───────────────────────────────────────────────────────
  let _editDocId = null;
  let _editItems = [];

  async function openEdit(docId) {
    _editDocId = docId;
    const jo = await fsGet('job_orders', docId);
    document.getElementById('editTitle').textContent = `Edit ${jo.ref || docId}`;
    _editItems = JSON.parse(JSON.stringify(jo.items || []));
    renderEditBody();
    document.getElementById('editOverlay').classList.add('open');
  }

  function closeEdit() {
    document.getElementById('editOverlay').classList.remove('open');
    _editDocId = null;
    _editItems = [];
  }

  function renderEditBody() {
    const html = _editItems.map((item, idx) => {
      const thumb = item.image
        ? `<img class="jo-item-thumb" src="${item.image}" alt="">`
        : `<div class="jo-item-thumb-ph"></div>`;
      const isMtsOnly = !item.mto?.qty;
      const ordersInfo = (item.mto?.orders || []).map(o => `#${o.order_id} ×${o.qty}`).join(' · ');
      return `
        <div class="edit-item">
          <div class="edit-item-top">
            ${thumb}
            <span class="edit-item-name">${item.product_name}</span>
            ${isMtsOnly ? '<span class="mts-only-badge">MTS only</span>' : ''}
            <div class="mts-col">
              <span class="mts-col-lbl">MTS</span>
              <input class="edit-mts-input" type="number" min="0" value="${item.mts?.qty || 0}"
                oninput="_editItems[${idx}].mts.qty=parseInt(this.value)||0; _editItems[${idx}].total_qty=(_editItems[${idx}].mto?.qty||0)+(parseInt(this.value)||0)">
            </div>
            <button class="remove-btn" title="Remove item" onclick="removeEditItem(${idx})">×</button>
          </div>
          ${ordersInfo ? `<div class="edit-mto-info">MTO: ${ordersInfo}</div>` : ''}
        </div>`;
    }).join('');

    document.getElementById('editBody').innerHTML = html || '<div class="state-msg" style="padding:20px;">No items</div>';
  }

  function removeEditItem(idx) {
    _editItems.splice(idx, 1);
    renderEditBody();
  }

  async function saveEdit() {
    const btn = document.getElementById('editSaveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await fsUpdate('job_orders', _editDocId, { items: _editItems });
      closeEdit();
      renderHistory();
    } catch(e) {
      alert('Error saving: ' + e.message);
    }
    btn.disabled = false; btn.textContent = 'Save Changes';
  }

  // ── Export PDF ────────────────────────────────────────────────────
  async function exportPDF(docId) {
    const btn = event.target;
    btn.textContent = '…'; btn.disabled = true;
    // Open window synchronously before any await — required for iOS Safari
    const w = window.open('', '_blank');
    if (w) w.document.write('<html><body style="font-family:sans-serif;padding:20px;color:#aaa">Generating PDF…</body></html>');
    try {
      const jo = await fsGet('job_orders', docId);
      const items = jo.items || [];

      // Fetch WC product prices in one call
      const ids = [...new Set(items.map(i => i.product_id))].join(',');
      const res = await fetch(`https://timberedgroup.com/wp-json/wc/v3/products?${WC_CREDS}&include=${ids}&per_page=100`);
      const prods = await res.json();
      const priceMap = {};
      prods.forEach(p => { priceMap[p.id] = parseFloat(p.price) || 0; });

      const date = jo.created_at?.toDate ? jo.created_at.toDate() : new Date();
      const dateStr = date.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

      let grandTotal = 0;
      const rows = items.map(item => {
        const unitPrice = priceMap[item.product_id] || 0;
        const value = unitPrice * (item.total_qty || 0);
        const stockQty = item.stock_qty ?? productStockQty(item.product_id);
        const orderedQty = item.total_ordered_qty ?? productOrderedQty(item.product_id);
        grandTotal += value;
        const mtoOrders = (item.mto?.orders || []).map(o => `#${o.order_id}(×${o.qty})`).join(', ');
        return `<tr>
          <td>${item.product_name}</td>
          <td class="num">${stockQty}</td>
          <td class="num">${orderedQty}</td>
          <td class="num">${item.mto?.qty || 0}${mtoOrders ? `<br><small style="color:#888">${mtoOrders}</small>` : ''}</td>
          <td class="num">${item.mts?.qty || 0}</td>
          <td class="num"><strong>${item.total_qty || 0}</strong></td>
          <td class="num">${unitPrice.toLocaleString()} EGP</td>
          <td class="num"><strong>${value.toLocaleString()} EGP</strong></td>
        </tr>`;
      }).join('');

      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
        <title>${jo.ref}</title>
        <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body { font-family: Arial, sans-serif; font-size: 12px; color: #222; padding: 32px; }
          .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
          .logo { font-size: 20px; font-weight: 900; color: #7A4610; letter-spacing: 1px; }
          .jo-meta { text-align: right; }
          .jo-ref { font-size: 18px; font-weight: 800; color: #7A4610; }
          .jo-date { font-size: 11px; color: #888; margin-top: 2px; }
          h2 { font-size: 13px; color: #555; margin-bottom: 10px; border-bottom: 1px solid #e0d8d0; padding-bottom: 4px; }
          table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
          th { background: #7A4610; color: #fff; padding: 7px 10px; font-size: 11px; text-align: left; }
          th.num, td.num { text-align: right; }
          td { padding: 7px 10px; border-bottom: 1px solid #f0ebe4; font-size: 11px; vertical-align: top; }
          tr:nth-child(even) td { background: #faf7f4; }
          .total-row td { border-top: 2px solid #7A4610; font-weight: 700; font-size: 13px; padding-top: 10px; }
          .footer { margin-top: 32px; font-size: 10px; color: #aaa; text-align: center; }
          @media print { body { padding: 16px; } button { display: none; } }
        </style>
      </head><body>
        <div class="header">
          <div>
            <div class="logo">TIMBERED</div>
            <div style="font-size:11px;color:#888;margin-top:4px;">Job Order Report</div>
          </div>
          <div class="jo-meta">
            <div class="jo-ref">${jo.ref}</div>
            <div class="jo-date">${dateStr}</div>
            <div class="jo-date" style="margin-top:4px;">Status: ${jo.status || 'open'}</div>
          </div>
        </div>
        <h2>Items</h2>
        <table>
          <thead><tr>
            <th>Product</th>
            <th class="num">Stock</th>
            <th class="num">Ordered</th>
            <th class="num">MTO</th>
            <th class="num">MTS</th>
            <th class="num">Total Qty</th>
            <th class="num">Unit Price</th>
            <th class="num">Value</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="total-row">
            <td colspan="7" style="text-align:right;">Total JO Value</td>
            <td class="num">${grandTotal.toLocaleString()} EGP</td>
          </tr></tfoot>
        </table>
        <div class="footer">Generated ${new Date().toLocaleString('en-GB')} · Timbered Dashboard</div>
        <script>window.onload=()=>window.print();<\/script>
      </body></html>`;

      if (w) { w.document.write(html); w.document.close(); }
      else { const a=document.createElement('a'); a.href='data:text/html;charset=utf-8,'+encodeURIComponent(html); a.download=`${jo.ref||'JO'}.html`; a.click(); }
    } catch(e) {
      if (w) w.close();
      alert('Error generating PDF: ' + e.message);
    }
    btn.textContent = 'PDF'; btn.disabled = false;
  }



  // ── Delete JO ─────────────────────────────────────────────────────
  async function deleteJO(docId, ref) {
    if (!confirm(`Delete ${ref}? This cannot be undone.`)) return;
    try {
      await fsDelete('job_orders', docId);
      document.getElementById(`jo-${docId}`)?.remove();
      const badge = document.getElementById('histBadge');
      badge.textContent = Math.max(0, parseInt(badge.textContent) - 1);
    } catch(e) {
      alert('Error deleting: ' + e.message);
    }
  }

  // ── Render History tab ────────────────────────────────────────────
  async function renderHistory() {
    const wrap = document.getElementById('histWrap');
    wrap.innerHTML = '<div class="state-msg">Loading history…</div>';
    try {
      const docs = await fsQuery('job_orders');
      document.getElementById('histBadge').textContent = docs.length;
      if (!docs.length) { wrap.innerHTML = '<div class="state-msg">No job orders yet</div>'; return; }

      const html = docs.map(jo => {
        const itemCount = (jo.items || []).length;
        const totalQty = (jo.items || []).reduce((s, i) => s + (i.total_qty || 0), 0);
        const statusCls = jo.status === 'open' ? 'status-open' : 'status-done';
        const statusLbl = jo.status === 'open' ? 'Open' : 'Done';

        const itemsHtml = (jo.items || []).map(item => {
          const thumb = item.image
            ? `<img class="jo-item-thumb" src="${item.image}" alt="">`
            : `<div class="jo-item-thumb-ph"></div>`;
          const stockQty = item.stock_qty ?? productStockQty(item.product_id);
          const orderedQty = item.total_ordered_qty ?? productOrderedQty(item.product_id);
          const ordersHtml = (item.mto?.orders || []).map(o =>
            `<span class="jo-order-pill">#${o.order_id} · ${o.customer} · ×${o.qty}</span>`
          ).join('');
          return `
            <div class="jo-item">
              <div class="jo-item-top">
                ${thumb}
                <span class="jo-item-name">${item.product_name}</span>
              </div>
              <div class="jo-qty-row">
                <span class="jo-qty-chip">Stock <span>${stockQty}</span></span>
                <span class="jo-qty-chip">Ordered <span><button class="ordered-link" onclick="event.stopPropagation();showProductOrderedDetails(${item.product_id})">${orderedQty}</button></span></span>
                <span class="jo-qty-chip">MTO <span>${item.mto?.qty || 0}</span></span>
                <span class="jo-qty-chip mts">MTS <span>${item.mts?.qty || 0}</span></span>
                <span class="jo-qty-chip total">Total <span>${item.total_qty || 0}</span></span>
              </div>
              ${ordersHtml ? `<div class="jo-orders-list">${ordersHtml}</div>` : ''}
            </div>`;
        }).join('');

        return `
          <div class="jo-card" id="jo-${jo._id}">
            <div class="jo-top" onclick="this.closest('.jo-card').classList.toggle('open')">
              <div class="jo-top-row1">
                <span class="jo-ref">${jo.ref || '—'}</span>
                <span class="status-badge ${statusCls}">${statusLbl}</span>
                <span class="jo-date">${fmtDate(jo.created_at)}</span>
                <span class="jo-chev">▼</span>
              </div>
              <div class="jo-top-row2">
                <span class="jo-count">${itemCount} products · ${totalQty} units</span>
                <button class="jo-pdf-btn" onclick="event.stopPropagation();exportPDF('${jo._id}')">PDF</button>
                <button class="jo-cutlist-btn" onclick="event.stopPropagation();window.open('cutlists.html?jo=${jo._id}','_blank')">Cutlist</button>
                <button class="jo-edit-btn" onclick="event.stopPropagation();openEdit('${jo._id}')">Edit</button>
                <button class="jo-delete-btn" onclick="event.stopPropagation();deleteJO('${jo._id}','${jo.ref||''}')">Delete</button>
              </div>
            </div>
            <div class="jo-body">${itemsHtml}</div>
          </div>`;
      }).join('');

      wrap.innerHTML = html;
    } catch (e) {
      wrap.innerHTML = `<div class="state-msg">Error: ${e.message}</div>`;
    }
  }

  // ── Order detail popup ────────────────────────────────────────────
  let _allOrders = [];

  function showProductOrderedDetails(productId) {
    const rows = [];
    _allOrders.forEach(order => {
      (order.line_items || [])
        .filter(item => item.product_id === productId)
        .forEach(item => rows.push({ order, item }));
    });

    const productName = rows[0]?.item?.name
      || _wcProducts.find(p => p.product_id === productId)?.name
      || _fsProducts.find(p => p.product_id === productId)?.name
      || `Product #${productId}`;
    const totalQty = rows.reduce((sum, row) => sum + (row.item.quantity || 0), 0);

    const rowsHtml = rows.length ? rows.map(({ order, item }) => {
      const b = order.billing || {};
      const customer = [b.first_name, b.last_name].filter(Boolean).join(' ') || '—';
      const date = (order.date_created || '').replace('T', ' ').slice(0, 10);
      const phase = getPhase(order.id, item);
      return `<div class="od-item-row">
        <span class="mto-order-id mto-order-id-link" onclick="showOrderDetail(${order.id})">#${order.id}</span>
        <span class="od-item-name">${customer}</span>
        <span class="od-meta" style="margin-top:0;flex-shrink:0;">${date}</span>
        <span class="od-item-qty">×${item.quantity || 0}</span>
        <span class="od-item-phase">${phase}</span>
      </div>`;
    }).join('') : '<div class="od-meta">No loaded processing orders for this product.</div>';

    document.getElementById('odTitle').textContent = `Ordered · ${productName}`;
    document.getElementById('odBody').innerHTML = `
      <div class="od-section">
        <div class="od-section-lbl">Product</div>
        <div class="od-customer-name">${productName}</div>
        <div class="od-meta">Product #${productId}</div>
      </div>
      <div class="od-total-row">
        <span class="od-total-lbl">Total Ordered</span>
        <span class="od-total-val">${totalQty}</span>
      </div>
      <div class="od-section">
        <div class="od-section-lbl">Orders</div>
        ${rowsHtml}
      </div>`;
    document.getElementById('odOverlay').classList.add('open');
  }

  function showOrderDetail(orderId) {
    const order = _allOrders.find(o => o.id === orderId);
    if (!order) return;
    const b = order.billing || {};
    const customer = [b.first_name, b.last_name].filter(Boolean).join(' ') || '—';
    const date = (order.date_created || '').replace('T', ' ').slice(0, 16);
    const total = Math.round(parseFloat(order.total || 0)).toLocaleString();

    const itemsHtml = (order.line_items || []).map(item => {
      const phase = getPhase(orderId, item);
      const thumb = item.image?.src
        ? `<img class="od-item-thumb" src="${item.image.src}" alt="">`
        : `<div class="od-item-thumb-ph"></div>`;
      return `<div class="od-item-row">
        ${thumb}
        <span class="od-item-name">${item.name}</span>
        <span class="od-item-qty">×${item.quantity}</span>
        <span class="od-item-phase">${phase}</span>
      </div>`;
    }).join('');

    document.getElementById('odTitle').textContent = `Order #${orderId}`;
    document.getElementById('odBody').innerHTML = `
      <div class="od-section">
        <div class="od-customer-name">${customer}</div>
        ${b.phone ? `<div class="od-meta">📞 ${b.phone}</div>` : ''}
        ${[b.address_1, b.address_2, b.city].filter(Boolean).length ? `<div class="od-meta">${[b.address_1, b.address_2, b.city].filter(Boolean).join(', ')}</div>` : ''}
        <div class="od-meta">${date}</div>
        ${order.customer_note ? `<div class="od-meta" style="color:#e67e22;margin-top:4px">📝 ${order.customer_note}</div>` : ''}
      </div>
      <div class="od-section">
        <div class="od-section-lbl">Items</div>
        ${itemsHtml}
      </div>
      <div class="od-total-row">
        <span class="od-total-lbl">Total</span>
        <span class="od-total-val">${total} EGP</span>
      </div>`;
    document.getElementById('odOverlay').classList.add('open');
  }

  function closeOrderDetail() {
    document.getElementById('odOverlay').classList.remove('open');
  }

  // ── Tab switching ─────────────────────────────────────────────────
  let _wcProducts = [];

  function setTab(id) {
    document.getElementById('tabNew').classList.toggle('active', id === 'tabNew');
    document.getElementById('tabHistory').classList.toggle('active', id === 'tabHistory');
    document.getElementById('newToolbar').style.display = id === 'tabNew' ? 'flex' : 'none';
    document.getElementById('newWrap').style.display = id === 'tabNew' ? 'block' : 'none';
    document.getElementById('histWrap').style.display = id === 'tabHistory' ? 'block' : 'none';
    document.getElementById('submitBar').style.display = id === 'tabNew' && _wcProducts.length ? 'flex' : 'none';
    if (id === 'tabHistory') renderHistory();
  }

  document.getElementById('tabNew').addEventListener('click', () => setTab('tabNew'));
  document.getElementById('tabHistory').addEventListener('click', () => setTab('tabHistory'));

  // ── Load / Reload JO orders ───────────────────────────────────────
  async function loadJOOrders() {
    const btn = document.getElementById('loadOrdersBtn');
    if (btn) { btn.disabled = true; btn.textContent = '↻ Loading…'; }
    const stateEl = document.getElementById('stateMsg');
    stateEl.textContent = 'Loading orders…';
    stateEl.style.display = 'block';
    document.getElementById('newWrap').style.display = 'none';
    try {
      const [orders] = await Promise.all([fetchAllOrders(), loadPhasesFS(), loadStockcountFS()]);
      _allOrders = orders;
      buildOrderedQtyMap(orders);
      _excludedPids   = new Set();
      _excludedOrders = {};
      orders.forEach(o => (o.line_items || []).forEach(i => {
        if (i.product_id && !_priceMap[i.product_id]) _priceMap[i.product_id] = parseFloat(i.price) || 0;
      }));
      _wcProducts = groupByProduct(orders);
      if (_wcProducts.length) {
        const ids = _wcProducts.map(p => p.product_id).join(',');
        const res  = await fetch(`https://timberedgroup.com/wp-json/wc/v3/products?${WC_CREDS}&include=${ids}&per_page=100`);
        const prods = await res.json();
        prods.forEach(p => {
          const dwg  = (p.meta_data || []).find(m => m.key === 'tg_drawing_url')?.value || '';
          const prod = _wcProducts.find(x => x.product_id === p.id);
          if (prod) prod.dwg_url = dwg;
          _priceMap[p.id] = parseFloat(p.price) || _priceMap[p.id] || 0;
        });
      }
      stateEl.style.display = 'none';
      document.getElementById('newWrap').style.display = 'block';
      document.getElementById('newToolbar').style.display = 'flex';
      renderNew(_wcProducts);
    } catch(e) {
      stateEl.textContent = 'Error loading orders: ' + e.message;
    }
    if (btn) { btn.disabled = false; btn.textContent = '↻ Load Orders in JO Prep'; }
  }

  // ── Init ──────────────────────────────────────────────────────────
  loadJOOrders();
</script>
