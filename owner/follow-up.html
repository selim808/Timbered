<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-Up — Timbered</title>
  <link rel="shortcut icon" type="image/png" href="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0eb; color: #333; }

    .site-header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 100; }
    .site-header img { height: 26px; display: block; }
    .site-header .title { font-size: 14px; font-weight: 700; color: #7A4610; flex: 1; }
    .back { font-size: 12px; color: #7A4610; text-decoration: none; border: 1px solid #7A4610; border-radius: 20px; padding: 4px 12px; white-space: nowrap; }

    .toolbar { background: #fff; border-bottom: 1px solid #e8ddd4; padding: 8px 12px; display: flex; gap: 8px; align-items: center; position: sticky; top: 51px; z-index: 99; }
    #searchInput { flex: 1; font-size: 13px; padding: 6px 12px; border: 1.5px solid #e8ddd4; border-radius: 8px; outline: none; color: #333; }
    #searchInput:focus { border-color: #7A4610; }
    .count-badge { font-size: 11px; background: #fef3e2; color: #7A4610; border-radius: 10px; padding: 2px 10px; font-weight: 700; white-space: nowrap; }

    #state { text-align: center; color: #aaa; padding: 60px 20px; font-size: 14px; }

    .list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-width: 680px; margin: 0 auto; }

    .order-card { background: #fff; border: 1px solid #e8ddd4; border-radius: 12px; overflow: hidden; }
    .order-card-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
    .order-card-top:hover { background: #fdf8f4; }
    .order-id { font-size: 13px; font-weight: 800; color: #7A4610; flex-shrink: 0; }
    .order-name { font-size: 13px; font-weight: 600; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order-date { font-size: 11px; color: #aaa; flex-shrink: 0; }
    .order-chev { font-size: 11px; color: #bbb; flex-shrink: 0; transition: transform 0.15s; }
    .order-card.open .order-chev { transform: rotate(180deg); }

    .order-body { display: none; border-top: 1px solid #f5f0eb; padding: 10px 14px; }
    .order-card.open .order-body { display: block; }

    .order-items { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
    .order-item-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; padding: 3px 0; border-bottom: 1px solid #f5f0eb; }
    .order-item-row:last-child { border-bottom: none; }
    .item-thumb { width: 32px; height: 32px; border-radius: 5px; object-fit: cover; border: 1px solid #e8ddd4; flex-shrink: 0; }
    .item-thumb-ph { width: 32px; height: 32px; border-radius: 5px; background: #f0e8e0; flex-shrink: 0; }
    .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-qty { font-weight: 700; color: #333; flex-shrink: 0; }

    .order-actions { display: flex; gap: 8px; align-items: center; }
    .order-phone { font-size: 12px; color: #555; flex: 1; }
    .wa-btn { display: inline-flex; align-items: center; gap: 6px; background: #25d366; color: #fff; border: none; border-radius: 20px; padding: 7px 16px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; flex-shrink: 0; }
    .wa-btn:hover { background: #1da851; }
    .wa-btn svg { width: 15px; height: 15px; fill: #fff; flex-shrink: 0; }
  </style>
</head>
<body>

<header class="site-header">
  <img src="https://timberedgroup.com/wp-content/uploads/2024/04/Asset-14.png" alt="Timbered">
  <span class="title">Follow-Up</span>
  <a href="index.html" class="back">← Back</a>
</header>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Search order, name, phone…">
  <span class="count-badge" id="countBadge">—</span>
</div>

<div id="state">Loading…</div>
<div class="list" id="list" style="display:none;"></div>

<script>
  const WC_CREDS  = "consumer_key=ck_dbdad7d7e7e2993164087fd562caf37f14dca362"
                  + "&consumer_secret=cs_a08685ea3cf820bb8056e2e9039abc4e9f7244de";
  const WC_BASE   = "https://timberedgroup.com/wp-json/wc/v3";

  const WA_MSG = "مساء الخير يا فندم\nحابين نعرف رأي حضرتك في المنتج و الخدمة";

  let allOrders = [];

  async function fetchCompleted() {
    let page = 1, result = [];
    while (true) {
      const r = await fetch(`${WC_BASE}/orders?${WC_CREDS}&status=completed&per_page=100&orderby=date&order=desc&page=${page}`);
      const b = await r.json();
      if (!Array.isArray(b) || !b.length) break;
      result = result.concat(b);
      if (b.length < 100) break;
      page++;
    }
    return result;
  }

  function waUrl(phone) {
    const num = phone.replace(/\D/g, '').replace(/^0/, '20');
    return `https://wa.me/${num}?text=${encodeURIComponent(WA_MSG)}`;
  }

  function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });
  }

  function matches(o, q) {
    if (!q) return true;
    const name  = [o.billing.first_name, o.billing.last_name].join(' ').toLowerCase();
    const phone = (o.billing.phone || '').toLowerCase();
    return String(o.id).includes(q) || name.includes(q) || phone.includes(q);
  }

  function render() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allOrders.filter(o => matches(o, q));
    document.getElementById('countBadge').textContent = filtered.length;

    if (!filtered.length) {
      document.getElementById('list').innerHTML = `<div style="text-align:center;color:#aaa;padding:40px 0;font-size:14px;">No completed orders found</div>`;
      return;
    }

    document.getElementById('list').innerHTML = filtered.map(o => {
      const name  = [o.billing.first_name, o.billing.last_name].filter(Boolean).join(' ') || '—';
      const date  = fmtDate(o.date_completed || o.date_modified);
      const phone = o.billing.phone || '';
      const items = (o.line_items || []).map(i =>
        `<div class="order-item-row">
          ${i.image?.src ? `<img class="item-thumb" src="${i.image.src}" alt="">` : `<div class="item-thumb-ph"></div>`}
          <span class="item-name">${i.name}</span>
          <span class="item-qty">×${i.quantity}</span>
        </div>`
      ).join('');

      return `<div class="order-card" id="oc-${o.id}">
        <div class="order-card-top" onclick="toggle(${o.id})">
          <span class="order-id">#${o.id}</span>
          <span class="order-name">${name}</span>
          <span class="order-date">${date}</span>
          <span class="order-chev">▼</span>
        </div>
        <div class="order-body">
          <div class="order-items">${items}</div>
          <div class="order-actions">
            <span class="order-phone">${phone}</span>
            ${phone ? `<a class="wa-btn" href="${waUrl(phone)}" target="_blank">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              WhatsApp
            </a>` : `<span style="font-size:12px;color:#aaa;">No phone</span>`}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggle(id) {
    document.getElementById('oc-' + id)?.classList.toggle('open');
  }

  document.getElementById('searchInput').addEventListener('input', render);

  fetchCompleted().then(orders => {
    allOrders = orders;
    document.getElementById('state').style.display = 'none';
    document.getElementById('list').style.display = 'flex';
    render();
  }).catch(e => {
    document.getElementById('state').textContent = 'Error: ' + e.message;
  });
</script>
</body>
</html>
